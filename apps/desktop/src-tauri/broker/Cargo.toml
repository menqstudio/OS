[package]
name = "brops-broker"
version = "0.1.0"
edition = "2021"
publish = false
description = "BroPS trusted broker service as a SEPARATE binary crate (rev-30 §0 role #2, §4.10(g)): opens the receipt/broker SQLite DB, binds the renderer→broker AF_UNIX listener, authenticates each connecting peer, and drives one governed turn per connection via brops-core::broker_orchestrator::run_governed_turn. The socket/peer-cred path is Linux-only; every other host fails closed."

# The governed-chain orchestration (chain_executor / chain_hops) is exposed as a library so the Linux
# live-turn driver (proof crate) can wire the SAME LinuxGovernedTurnChain / LinuxHopConnector /
# LinuxGovernedExecution the broker binary uses — one source of truth for the real chain.
[lib]
name = "brops_broker"
path = "src/lib.rs"

[[bin]]
name = "brops-broker"
path = "src/main.rs"

[dependencies]
# The broker reuses the already-landed governed-turn control flow, framing, peer
# auth, and the four SQLite schemas. It NEVER re-implements those rules — it wires
# the transport around brops-core so the broker and the recorder-side checks share
# ONE source of truth.
brops-core = { path = "../core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"

# SO_PEERCRED / getsockopt live only on Linux. libc + base64 are pulled in ONLY on Linux (the live
# privileged execution decodes the supervisor's base64url evidence JCS); the Windows/other-host build stays
# pure-std and fails closed at runtime.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
base64 = "0.22"

# Test-only crypto: the governed-turn unit tests build a REAL signed receipt envelope +
# supervisor attestation (the same Ed25519 / base64url the isolated signer and supervisor
# produce) so `governed_verification::verify_and_accept` runs its real predicate against the
# fake chain. Shipping broker code carries NO signing key — these are dev-only, matching the
# verify-only crypto in brops-core (and the retired governed_proof harness).
[dev-dependencies]
ed25519-dalek = "2"
base64 = "0.22"
