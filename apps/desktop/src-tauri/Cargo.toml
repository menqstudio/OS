[workspace]
members = ["core", "launcher", "executor", "broker", "proof", "win-broker", "win-live", "provision", "audit-signer"]

[package]
name = "brops"
version = "0.1.0"
publish = false
edition = "2021"
description = "BroPS desktop host (Tauri)."

# The GUI host depends on `tauri`, which needs system webview libraries
# (webkit2gtk on Linux) to build. The UI-independent data core in `core/`
# builds and tests on its own: `cargo test -p brops-core`.

[lib]
name = "brops_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# A DEVELOPMENT build that pre-selects the local `claude` CLI — and turns AGENT MODE on.
#
# "Local" is the whole of what is narrow about it. This said "the local, sandboxed `claude` CLI"
# and never mentioned agent mode: the same block in src/lib.rs sets `BROPS_PROJECT_DIR` (to
# `~/BroPS` unless `project-dir.txt` names another folder), and with that set a turn runs rooted
# in that folder with Read/Edit/Write/Grep/Glob, Bash and Task under `acceptEdits` — commands run
# there without a per-step approval. Only with the record blanked does the turn fall back to the
# tool-less sandbox.
#
# The shipped default refuses to pick a provider at all (Wave 1 / T-012): there is no silent
# governed->ungoverned fallback, so running an ungoverned model has to be an explicit act. That
# refusal is the product behaviour and this feature does NOT change it -- `resolve_provider` is
# untouched, and a build without this feature behaves exactly as before.
#
# What it changes is WHERE the explicit act happens: choosing to install a binary whose name says
# `dev-ungoverned` is the act, instead of setting an environment variable afterwards. The governed
# path stays shut either way, and every reply is still labelled ungoverned by the UI.
dev-ungoverned = []

[dependencies]
tauri = { version = "2", features = [] }
# T-011: renderer-independent native confirmation dialog for privileged approvals,
# driven from Rust (the webview cannot forge it).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
brops-core = { path = "core" }
# First-launch trust provisioning (mints the operator-signed trusted-key registry,
# the out-of-registry operator-root pin and the operator-signed artifacts the engine
# requires). Its own crate because it must hold PRIVATE key halves, and `brops-core`
# deliberately keeps ed25519-dalek verify-only so the data core is never a
# `sign(arbitrary_bytes)` oracle. Cross-platform: not a `cfg(windows)` dependency.
brops-provision = { path = "provision" }
# T-011 single-instance enforcement: an exclusive advisory file lock held for the
# process lifetime, so a second instance cannot open the DB / run reconciliation and
# invalidate the first instance's live execution.
fs2 = "0.4"
# HTTP client for the AI provider layer (Ollama / Anthropic). rustls keeps it
# off system OpenSSL for portable CI builds.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Async subprocess for the local `claude` CLI provider (uses the user's own
# Claude Code login — no separate API key).
tokio = { version = "1", features = ["process", "rt", "io-util", "time"] }

# Windows-only: the LIVE governed-turn kit. A REAL challenge→lease→attest→sign→
# verify run with real ed25519 crypto, under the compiled-in DEMONSTRATION anchor.
# Two commands use it, not one:
#   * `governed_trust_selftest` (src/governed_selftest.rs) — the owner-visible
#     self-test, which posts nothing;
#   * `demonstration_verified_reply` (src/commands.rs) — which DOES run a model on a
#     chat turn: it spawns `cmd /C $BROPS_SELFTEST_MODEL_CMD` over the conversation
#     transcript inside the chain and posts the reply with a `demonstration_verified`
#     badge. It refuses without that variable and off Windows.
# This comment used to say the kit was used "solely" for the self-test and "never
# touches live AI turns". The second command is exactly that, at demonstration
# custody. What stays true: neither can produce production `trusted_verified`, and
# the ordinary chat/ask/run-step turns stay fail-closed under NoTrustedManifest.
[target.'cfg(windows)'.dependencies]
brops-win-live = { path = "win-live" }

[dev-dependencies]
tempfile = "3"
