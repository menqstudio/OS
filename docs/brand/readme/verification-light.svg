<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440"
     role="img" aria-labelledby="t d" font-family="Inter, &apos;Segoe UI&apos;, system-ui, -apple-system, &apos;Noto Sans Armenian&apos;, Arial, sans-serif">
  <title id="t">Ստուգման վիճակը · Verification state</title>
  <desc id="d">light theme. MenQ ground #ffffff, OS accent #3856fe.</desc>

  <!-- ground -->
  <rect x="0" y="0" width="1200" height="440" rx="12" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="12" fill="none" stroke="#e2e5ea"/>

  <text x="40" y="44" font-size="12" letter-spacing="2.4" fill="#5b6473">VERIFICATION STATE · ՍՏՈՒԳՄԱՆ ՎԻՃԱԿԸ</text>
  <text x="40" y="78" font-size="12" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#5b6473">config/negative-matrix.json — 242 declared security negatives, every ID bound to one of three</text>

  <!-- 150 / 54 / 38 of 242, to scale: 694 / 250 / 176 of 1120 px -->
  <path d="M734 104 H52 A12 12 0 0 0 40 116 V148 A12 12 0 0 0 52 160 H734 Z" fill="#156c3a"/>
  <rect x="734" y="104" width="250" height="56" fill="#885000"/>
  <path d="M984 104 H1148 A12 12 0 0 1 1160 116 V148 A12 12 0 0 1 1148 160 H984 Z" fill="#5b6473"/>

  <!-- unreviewed is hatched: it is an unknown, not a pass -->
  <line x1="984" y1="160" x2="1040" y2="104" stroke="#ffffff" stroke-width="2.5" opacity="0.22"/>
  <line x1="1008" y1="160" x2="1064" y2="104" stroke="#ffffff" stroke-width="2.5" opacity="0.22"/>
  <line x1="1032" y1="160" x2="1088" y2="104" stroke="#ffffff" stroke-width="2.5" opacity="0.22"/>
  <line x1="1056" y1="160" x2="1112" y2="104" stroke="#ffffff" stroke-width="2.5" opacity="0.22"/>
  <line x1="1080" y1="160" x2="1136" y2="104" stroke="#ffffff" stroke-width="2.5" opacity="0.22"/>
  <line x1="1104" y1="160" x2="1160" y2="104" stroke="#ffffff" stroke-width="2.5" opacity="0.22"/>
  <rect x="986" y="112" width="172" height="40" rx="8" fill="#5b6473"/>
  <line x1="734" y1="104" x2="734" y2="160" stroke="#ffffff" stroke-width="2"/>
  <line x1="984" y1="104" x2="984" y2="160" stroke="#ffffff" stroke-width="2"/>
  <text x="387" y="133" font-size="20" font-weight="700" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#ffffff" text-anchor="middle">150</text>
  <text x="387" y="151" font-size="11" fill="#ffffff" text-anchor="middle">implemented · իրագործված</text>
  <text x="859" y="133" font-size="20" font-weight="700" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#ffffff" text-anchor="middle">54</text>
  <text x="859" y="151" font-size="11" fill="#ffffff" text-anchor="middle">blocked · խցանված</text>
  <text x="1072" y="133" font-size="20" font-weight="700" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#ffffff" text-anchor="middle">38</text>
  <text x="1072" y="151" font-size="11" fill="#ffffff" text-anchor="middle">unreviewed · չստուգված</text>

  <!-- the prose below sits on a FIXED grid, not under the segments: the bar is to scale, so its
       edges move with every bound row. Each column is tied to its band by colour. -->
  <rect x="40" y="176" width="4" height="72" rx="2" fill="#156c3a"/>
  <rect x="440" y="176" width="4" height="72" rx="2" fill="#885000"/>
  <rect x="800" y="176" width="4" height="72" rx="2" fill="#5b6473"/>
  <text x="56" y="192" font-size="11" fill="#5b6473">A test exists and carries the case ID.</text>
  <text x="56" y="208" font-size="11" fill="#5b6473">Թեստ կա ու կրում ա case-ի ID-ն։</text>
  <text x="456" y="192" font-size="11" fill="#5b6473">Each names what must exist first.</text>
  <text x="456" y="208" font-size="11" fill="#5b6473">Ամեն մեկը նշում ա՝ ինչ պիտի նախ</text>
  <text x="456" y="224" font-size="11" fill="#5b6473">գոյություն ունենա։</text>
  <text x="816" y="192" font-size="11" fill="#5b6473">Nobody has checked. Frozen as a baseline —</text>
  <text x="816" y="208" font-size="11" fill="#5b6473">the gate refuses NEW debt.</text>
  <text x="816" y="224" font-size="11" fill="#5b6473">Ոչ ոք չի ստուգել։ Սառեցված որպես baseline —</text>
  <text x="816" y="240" font-size="11" fill="#5b6473">գեյթը մերժում ա ՆՈՐ պարտքը։</text>

  <rect x="800" y="264" width="256" height="44" rx="12" fill="#f3e1e4" stroke="#ac2b40"/>
  <text x="928" y="283" font-size="12" font-weight="700" fill="#ac2b40" text-anchor="middle">unreviewed is not a pass</text>
  <text x="928" y="300" font-size="12" fill="#ac2b40" text-anchor="middle">unreviewed-ը անցում չի</text>

  <!-- what a command printed on 2026-09-19 at main c197b97 -->
  <rect x="40" y="336" width="211" height="80" rx="12" fill="#f5f6f8" stroke="#e2e5ea"/>
