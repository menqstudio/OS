  <text x="145" y="390" font-size="11" fill="#5b6473" text-anchor="middle">engine tests · 97 skipped</text>
  <text x="145" y="405" font-size="11" fill="#5b6473" text-anchor="middle">engine թեստ · 97 բաց թողնված</text>
  <rect x="267" y="336" width="211" height="80" rx="12" fill="#f5f6f8" stroke="#e2e5ea"/>
  <text x="372" y="370" font-size="22" font-weight="700" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#3856fe" text-anchor="middle">210</text>
  <text x="372" y="390" font-size="11" fill="#5b6473" text-anchor="middle">bridge tests</text>
  <text x="372" y="405" font-size="11" fill="#5b6473" text-anchor="middle">bridge թեստ</text>
  <rect x="494" y="336" width="211" height="80" rx="12" fill="#f5f6f8" stroke="#e2e5ea"/>
  <text x="599" y="370" font-size="22" font-weight="700" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#3856fe" text-anchor="middle">10</text>
  <text x="599" y="390" font-size="11" fill="#5b6473" text-anchor="middle">Rust crates</text>
  <text x="599" y="405" font-size="11" fill="#5b6473" text-anchor="middle">Rust crate-եր</text>
  <rect x="721" y="336" width="211" height="80" rx="12" fill="#f5f6f8" stroke="#e2e5ea"/>
  <text x="826" y="370" font-size="22" font-weight="700" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#3856fe" text-anchor="middle">39</text>
  <text x="826" y="390" font-size="11" fill="#5b6473" text-anchor="middle">gate scripts</text>
  <text x="826" y="405" font-size="11" fill="#5b6473" text-anchor="middle">gate script-եր</text>
  <rect x="948" y="336" width="211" height="80" rx="12" fill="#f5f6f8" stroke="#e2e5ea"/>
  <text x="1053" y="370" font-size="22" font-weight="700" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#3856fe" text-anchor="middle">34</text>
  <text x="1053" y="390" font-size="11" fill="#5b6473" text-anchor="middle">required contexts</text>
  <text x="1053" y="405" font-size="11" fill="#5b6473" text-anchor="middle">պարտադիր կոնտեքստ</text>
</svg>
