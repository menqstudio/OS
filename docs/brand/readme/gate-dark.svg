<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320"
     role="img" aria-labelledby="t d" font-family="Inter, &apos;Segoe UI&apos;, system-ui, -apple-system, &apos;Noto Sans Armenian&apos;, Arial, sans-serif">
  <title id="t">Արտադրական դարպասը · The production gate</title>
  <desc id="d">dark theme. MenQ ground #0b0d10, OS accent #7c8dff.</desc>

  <!-- ground -->
  <rect x="0" y="0" width="1200" height="320" rx="12" fill="#0b0d10"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="12" fill="none" stroke="#262b37"/>

  <text x="40" y="44" font-size="12" letter-spacing="2.4" fill="#98a2b3">THE PRODUCTION GATE · ԱՐՏԱԴՐԱԿԱՆ ԴԱՐՊԱՍԸ</text>

  <rect x="40" y="64" width="344" height="168" rx="12" fill="#14171f" stroke="#6cb2ff"/>
  <rect x="64" y="88" width="8" height="8" rx="2" fill="#6cb2ff"/>
  <text x="84" y="96" font-size="15" font-weight="700" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#eef1f6">contained</text>
  <text x="64" y="124" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6cb2ff">REACHED · ՀԱՍԱՆԵԼԻ</text>
  <text x="64" y="152" font-size="12" fill="#98a2b3">Ordinary chat runs through the Claude</text>
  <text x="64" y="170" font-size="12" fill="#98a2b3">CLI provider — contained, not governed.</text>
  <text x="64" y="192" font-size="12" fill="#98a2b3">Սովորական չատը անցնում ա Claude CLI-ով՝</text>
  <text x="64" y="210" font-size="12" fill="#98a2b3">զսպված, բայց ոչ կառավարվող։</text>

  <rect x="428" y="64" width="344" height="168" rx="12" fill="#14171f" stroke="#f0b23a"/>
  <rect x="452" y="88" width="8" height="8" rx="2" fill="#f0b23a"/>
  <text x="472" y="96" font-size="15" font-weight="700" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#eef1f6">governed</text>
  <text x="452" y="124" font-size="11" font-weight="700" letter-spacing="1.2" fill="#f0b23a">PROVEN IN THE KITS · ԱՊԱՑՈՒՑՎԱԾ</text>
  <text x="452" y="152" font-size="12" fill="#98a2b3">The chain is proven end to end on</text>
  <text x="452" y="170" font-size="12" fill="#98a2b3">Linux and Windows — in the kits.</text>
  <text x="452" y="192" font-size="12" fill="#98a2b3">Շղթան ապացուցված ա Linux-ի ու</text>
  <text x="452" y="210" font-size="12" fill="#98a2b3">Windows-ի վրա — kit-երում։</text>

  <rect x="816" y="64" width="344" height="168" rx="12" fill="#14171f" stroke="#f4869c"/>
  <rect x="840" y="88" width="8" height="8" rx="2" fill="#f4869c"/>
  <text x="860" y="96" font-size="15" font-weight="700" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#eef1f6">trusted_verified</text>
  <text x="840" y="124" font-size="11" font-weight="700" letter-spacing="1.2" fill="#f4869c">SHUT · ՓԱԿ</text>
  <path d="M1115 88 V84 A5 5 0 0 1 1125 84 V88" fill="none" stroke="#f4869c" stroke-width="2.5"/>
  <rect x="1112" y="88" width="16" height="13" rx="2" fill="#f4869c"/>
  <text x="840" y="152" font-size="12" fill="#98a2b3">Unreachable in the shipped app. Every</text>
  <text x="840" y="170" font-size="12" fill="#98a2b3">governed turn refuses, never pretends.</text>
  <text x="840" y="192" font-size="12" fill="#98a2b3">Shipped հավելվածում անհասանելի։ Ամեն</text>
  <text x="840" y="210" font-size="12" fill="#98a2b3">կառավարվող turn մերժում ա, չի ձևացնում։</text>

  <line x1="388" y1="148" x2="416" y2="148" stroke="#98a2b3" stroke-width="2"/>
  <polygon points="416,144 424,148 416,152" fill="#98a2b3"/>
  <line x1="776" y1="148" x2="812" y2="148" stroke="#f4869c" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="794" cy="148" r="10" fill="#0b0d10"/>
  <line x1="788" y1="142" x2="800" y2="154" stroke="#f4869c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="800" y1="142" x2="788" y2="154" stroke="#f4869c" stroke-width="2.5" stroke-linecap="round"/>

  <text x="40" y="268" font-size="12" font-weight="600" fill="#eef1f6">Opening it needs an independent audit AND the Owner&apos;s approval. A green CI run is neither.</text>
  <text x="40" y="292" font-size="12" fill="#98a2b3">Բացելու համար պետք ա անկախ աուդիտ ՈՒ Owner-ի հաստատումը։ Կանաչ CI-ն ոչ մեկն ա։</text>
</svg>
