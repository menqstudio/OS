  <!-- one bracket for phase 0, one bracket for all ten of 1-10: the state is claimed per group, never per phase -->
  <path d="M80 304 V312 H160 V304" fill="none" stroke="#4ade80" stroke-width="1.5"/>
  <path d="M84 324 V320 A4 4 0 0 1 92 320 V324" fill="none" stroke="#4ade80" stroke-width="2"/>
  <rect x="80" y="324" width="16" height="12" rx="2" fill="#4ade80"/>
  <text x="104" y="336" font-size="12" font-weight="700" fill="#4ade80">LOCKED</text>
  <text x="80" y="356" font-size="12" fill="#4ade80">ԿՈՂՊՎԱԾ</text>
  <path d="M176 304 V312 H1120 V304" fill="none" stroke="#f0b23a" stroke-width="1.5"/>
  <text x="176" y="336" font-size="12" font-weight="700" fill="#f0b23a">PHASES 1–10 — ALL PARTLY BUILT · ՓՈՒԼԵՐ 1–10 — ԲՈԼՈՐԸ ՄԱՍԱՄԲ ԿԱՌՈՒՑՎԱԾ</text>
  <text x="176" y="356" font-size="11" fill="#98a2b3">all ten drawn identically — no per-phase percentage is drawn here, on purpose</text>
  <text x="176" y="372" font-size="11" fill="#98a2b3">բոլոր տասը նույնությամբ գծված — փուլային տոկոս այստեղ գծված չի՝ դիտավորյալ</text>

  <!-- current state: one file holds it, two carry the same banner -->
  <rect x="40" y="424" width="560" height="120" rx="12" fill="#14171f" stroke="#262b37"/>
  <text x="64" y="456" font-size="13" font-weight="700" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#7c8dff">NEXT_CHAT.md</text>
  <text x="176" y="456" font-size="12" fill="#98a2b3">ընթացիկ վիճակը · current state</text>
  <rect x="64" y="472" width="160" height="56" rx="12" fill="#0b0d10" stroke="#262b37"/>
  <text x="144" y="496" font-size="12" fill="#eef1f6" text-anchor="middle">ճյուղ</text>
  <text x="144" y="516" font-size="12" fill="#98a2b3" text-anchor="middle">branch</text>
  <rect x="240" y="472" width="160" height="56" rx="12" fill="#0b0d10" stroke="#262b37"/>
  <text x="320" y="496" font-size="12" fill="#eef1f6" text-anchor="middle">PR</text>
  <text x="320" y="516" font-size="12" fill="#98a2b3" text-anchor="middle">pull request</text>
  <rect x="416" y="472" width="160" height="56" rx="12" fill="#0b0d10" stroke="#262b37"/>
  <text x="496" y="496" font-size="12" fill="#eef1f6" text-anchor="middle">խցանումներ</text>
  <text x="496" y="516" font-size="12" fill="#98a2b3" text-anchor="middle">blockers</text>

  <text x="648" y="456" font-size="12" fill="#98a2b3">նույն banner-ը · the same banner</text>
  <rect x="648" y="472" width="240" height="56" rx="12" fill="#14171f" stroke="#262b37" stroke-dasharray="4 4"/>
  <text x="768" y="504" font-size="13" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#98a2b3" text-anchor="middle">PROJECT_STATE.md</text>
  <rect x="920" y="472" width="240" height="56" rx="12" fill="#14171f" stroke="#262b37" stroke-dasharray="4 4"/>
  <text x="1040" y="504" font-size="13" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#98a2b3" text-anchor="middle">TASKS.md</text>
  <line x1="604" y1="500" x2="640" y2="500" stroke="#98a2b3" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="640,496 648,500 640,504" fill="#98a2b3"/>
  <line x1="892" y1="500" x2="912" y2="500" stroke="#98a2b3" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="912,496 920,500 912,504" fill="#98a2b3"/>

  <!-- the honest summary, in the section own words -->
  <rect x="40" y="568" width="256" height="80" rx="12" fill="#14171f" stroke="#262b37"/>
  <rect x="64" y="584" width="8" height="8" rx="2" fill="#98a2b3"/>
  <text x="84" y="592" font-size="11" font-weight="700" letter-spacing="1.2" fill="#98a2b3">SURFACES · ՄԱԿԵՐԵՍՆԵՐԸ</text>
  <text x="64" y="616" font-size="12" fill="#eef1f6">մակերեսները կան</text>
  <text x="64" y="636" font-size="12" fill="#98a2b3">the surfaces exist</text>

  <rect x="312" y="568" width="352" height="80" rx="12" fill="#332730" stroke="#f4869c"/>
  <rect x="336" y="584" width="8" height="8" rx="2" fill="#f4869c"/>
  <text x="356" y="592" font-size="11" font-weight="700" letter-spacing="1.2" fill="#f4869c">GOVERNED CHAIN · ԿԱՌԱՎԱՐՎՈՂ ՇՂԹԱՆ</text>
  <path d="M620 608 V604 A6 6 0 0 1 632 604 V608" fill="none" stroke="#f4869c" stroke-width="2.5"/>
  <rect x="612" y="608" width="28" height="20" rx="4" fill="#f4869c"/>
  <text x="336" y="616" font-size="12" font-weight="700" fill="#f4869c">ապացուցված, բայց ԳԵՅԹՈՎ ԱՆՋԱՏՎԱԾ</text>
  <text x="336" y="636" font-size="12" font-weight="700" fill="#f4869c">proven, but GATED OFF</text>

  <rect x="680" y="568" width="480" height="80" rx="12" fill="#14171f" stroke="#f0b23a"/>
  <rect x="704" y="584" width="8" height="8" rx="2" fill="#f0b23a"/>
  <text x="724" y="592" font-size="11" font-weight="700" letter-spacing="1.2" fill="#f0b23a">WHAT IS LEFT · ՄՆԱՑԱԾ ԳՈՐԾԸ</text>
  <text x="704" y="616" font-size="12" fill="#eef1f6">ԿԱՊԵԼ արդեն կառուցվածը, ՀԵՌԱՑՆԵԼ չհիմնավորված պնդումները</text>
  <text x="704" y="636" font-size="12" fill="#98a2b3">CONNECTING what was built, REMOVING claims nothing established</text>
</svg>
