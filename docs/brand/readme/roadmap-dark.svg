  <rect x="80" y="232" width="80" height="64" rx="12" fill="#4ade80"/>
  <text x="120" y="272" font-size="20" font-weight="700" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#0b0d10" text-anchor="middle">0</text>

