<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 688" width="1200" height="688"
     role="img" aria-labelledby="t d" font-family="Inter, &apos;Segoe UI&apos;, system-ui, -apple-system, &apos;Noto Sans Armenian&apos;, Arial, sans-serif">
  <title id="t">Ճանապարհային քարտեզը · Roadmap</title>
  <desc id="d">dark theme. MenQ ground #0b0d10, OS accent #7c8dff.</desc>

  <defs>
    <!-- partly built is hatched, never a solid fill and never green -->
    <pattern id="partly" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="4" y1="0" x2="4" y2="8" stroke="#f0b23a" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="1200" height="688" rx="12" fill="#0b0d10"/>
  <rect x="0.5" y="0.5" width="1199" height="687" rx="12" fill="none" stroke="#262b37"/>

  <text x="40" y="44" font-size="12" letter-spacing="2.4" fill="#98a2b3">ROADMAP · ՃԱՆԱՊԱՐՀԱՅԻՆ ՔԱՐՏԵԶԸ</text>

  <!-- the gate is the outermost container: no phase can be reached without crossing it first -->
  <rect x="40" y="64" width="1120" height="336" rx="12" fill="#332730" stroke="#f4869c" stroke-width="1.5"/>
  <rect x="64" y="80" width="8" height="8" rx="2" fill="#f4869c"/>
  <text x="84" y="88" font-size="11" font-weight="700" letter-spacing="1.2" fill="#f4869c">THE GATE · ԳԵՅԹԸ</text>

  <!-- a prohibition sign, not decoration: the struck percent -->
  <circle cx="88" cy="132" r="20" fill="none" stroke="#f4869c" stroke-width="2.5"/>
  <text x="88" y="140" font-size="22" font-weight="700" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#f4869c" text-anchor="middle">%</text>
  <line x1="72" y1="148" x2="104" y2="116" stroke="#f4869c" stroke-width="2.5" stroke-linecap="round"/>
  <text x="124" y="124" font-size="15" font-weight="700" fill="#f4869c">DO NOT READ A PHASE PERCENTAGE ANYWHERE AS A PROMISE ABOUT BEHAVIOUR.</text>
  <text x="124" y="152" font-size="15" font-weight="700" fill="#f4869c">ՈՉ ՄԻ ՏԵՂ ՓՈՒԼԻ ՏՈԿՈՍԸ ՈՐՊԵՍ ՎԱՐՔԻ ԽՈՍՏՈՒՄ ՄԻ ԿԱՐԴԱ։</text>

  <rect x="888" y="104" width="256" height="64" rx="12" fill="#f4869c"/>
  <text x="1016" y="132" font-size="15" font-weight="700" fill="#0b0d10" text-anchor="middle">READ THE GATE</text>
  <text x="1016" y="156" font-size="15" font-weight="700" fill="#0b0d10" text-anchor="middle">ԿԱՐԴԱ՛ ԳԵՅԹԸ</text>

  <!-- one level in: the canonical plan file, which is what holds the phases -->
  <rect x="56" y="184" width="1088" height="200" rx="12" fill="#0b0d10" stroke="#262b37"/>
  <text x="76" y="216" font-size="13" font-weight="700" font-family="&apos;JetBrains Mono&apos;, &apos;Cascadia Code&apos;, ui-monospace, Consolas, &apos;Courier New&apos;, monospace" fill="#7c8dff">MASTER_EXECUTION_ROADMAP.md</text>
  <text x="300" y="216" font-size="12" fill="#98a2b3">կանոնական պլանը · the canonical plan — 11 փուլ · 11 phases</text>

