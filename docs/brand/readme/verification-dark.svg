  <text x="40" y="192" font-size="11" fill="#98a2b3">A test exists and carries the case ID.</text>
  <text x="40" y="208" font-size="11" fill="#98a2b3">Թեստ կա ու կրում ա case-ի ID-ն։</text>
  <text x="651" y="192" font-size="11" fill="#98a2b3">Each names what must exist first.</text>
  <text x="651" y="208" font-size="11" fill="#98a2b3">Ամեն մեկը նշում ա՝ ինչ պիտի նախ</text>
  <text x="651" y="224" font-size="11" fill="#98a2b3">գոյություն ունենա։</text>
  <text x="901" y="192" font-size="11" fill="#98a2b3">Nobody has checked. Frozen as a baseline —</text>
  <text x="901" y="208" font-size="11" fill="#98a2b3">the gate refuses NEW debt.</text>
  <text x="901" y="224" font-size="11" fill="#98a2b3">Ոչ ոք չի ստուգել։ Սառեցված որպես baseline —</text>
  <text x="901" y="240" font-size="11" fill="#98a2b3">գեյթը մերժում ա ՆՈՐ պարտքը։</text>

