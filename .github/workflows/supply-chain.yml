name: supply-chain

# Supply-chain scan gate for menqstudio/OS.
#
# TEN INDEPENDENT jobs (one per ecosystem / concern) so a failure in one scanner
# never masks the others and each surfaces its own red X:
#   cargo-audit      - RustSec advisory scan of the Cargo.lock graph
#   cargo-deny       - advisories + license/bans/sources policy over the Rust graph
#   pip-audit        - PyPI advisory scan of the hash-pinned engine requirements
#   npm-audit        - npm advisory scan, filtered through a fail-closed high+ gate
#   sbom             - CycloneDX SBOMs (Rust + npm + Python) published as artifacts
#   action-pins      - one action to one pin, one commit to one action (F-46)
#   release-signing  - signing key and updater config can only move together
#   residual-items   - the O-1..O-5 inventory cannot drift from the canonical docs
#   reachability     - nothing ships implemented-and-uncalled without a written reason
#   gitleaks         - secret scan of the working tree and (on PRs) the commit range
# (The count and list above were stale at "Six" while four jobs had already been added —
#  corrected here rather than left as another claim nothing checks.)
#
# Every job fails closed on HIGH/CRITICAL severity. All third-party actions are
# pinned by full commit SHA (tag in trailing comment); the shared SHAs match the
# ones already vetted in .github/workflows/ci.yml. gitleaks is installed from a
# version-pinned release tarball whose integrity is checked against the release's
# own signed SHA256SUMS, so nothing depends on a floating tag.

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  schedule:
    # Weekly re-scan (Mondays 07:17 UTC) so a newly-published advisory against an
    # unchanged dependency graph still turns the repository red.
    - cron: "17 7 * * 1"

permissions:
  contents: read

# One in-flight run per ref; a newer push supersedes an older queued scan.
# `cancel-in-progress` was an unconditional `true` and carried the defect this
# repository gates on elsewhere: two merges close together share the group
# `supply-chain-refs/heads/main`, so the second cancelled the first, and a
# CANCELLED run on `main` is not a reading of `main` — neither success nor failure.
# Found while adding the same block to ci.yml; the fix is one expression and
# leaving a known hazard beside its twin would be worse than not looking.
concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SUPPLY_CHAIN_DIR: .github/supply-chain

jobs:
  cargo-audit:
    name: Rust - cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # Nine crates rebuilt from zero in every job that touches cargo: no workflow
      # cached anything, measured with `grep -c "rust-cache|~/.cargo" .github/workflows/*.yml`
      # returning 0 in all eleven files. Placed AFTER the toolchain step, not after
      # checkout: the plugin keys its cache on the CURRENT rustc version, so a cache
      # taken before the toolchain is selected is keyed on the runner's preinstalled
      # compiler and never hits. That is upstream's own instruction at this sha.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install cargo-audit (latest release, --locked; NOT version-pinned — see note)
        run: cargo install cargo-audit --locked  # deliberately unpinned: pinned 0.21.0's rustsec 0.30 cannot parse CVSS 4.0 advisory-db entries. --locked builds the latest release reproducibly from its own Cargo.lock; re-pin to a --version once a CVSS-4.0-capable rustsec build is chosen (audit F-45: the name no longer overclaims "version-pinned").
      - name: Audit the Cargo.lock advisory graph (fail on high+)
        # cargo-audit denies on any advisory by default; --deny warnings promotes
        # unmaintained/yanked warnings to hard failures too. Advisory IDs listed in
        # cargo-audit-ignore.txt (one RUSTSEC-XXXX per line) are passed as --ignore.
        run: |
          set -euo pipefail
          IGNORE_ARGS=""
          IGNORE_FILE="${SUPPLY_CHAIN_DIR}/cargo-audit-ignore.txt"
          if [ -f "$IGNORE_FILE" ]; then
            while IFS= read -r line; do
              id="${line%%#*}"
              id="$(echo "$id" | tr -d '[:space:]')"
              [ -z "$id" ] && continue
              IGNORE_ARGS="$IGNORE_ARGS --ignore $id"
            done < "$IGNORE_FILE"
          fi
          echo "cargo audit --deny warnings$IGNORE_ARGS"
          cargo audit \
            --file apps/desktop/src-tauri/Cargo.lock \
            --deny warnings \
            $IGNORE_ARGS

  cargo-deny:
    name: Rust - cargo-deny (advisories + bans + licenses + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # Nine crates rebuilt from zero in every job that touches cargo: no workflow
      # cached anything, measured with `grep -c "rust-cache|~/.cargo" .github/workflows/*.yml`
      # returning 0 in all eleven files. Placed AFTER the toolchain step, not after
      # checkout: the plugin keys its cache on the CURRENT rustc version, so a cache
      # taken before the toolchain is selected is keyed on the runner's preinstalled
      # compiler and never hits. That is upstream's own instruction at this sha.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install cargo-deny (latest release, --locked; NOT version-pinned — see note)
        run: cargo install cargo-deny --locked  # deliberately unpinned: 0.16.3's rustsec cannot parse CVSS 4.0 advisory-db entries. --locked builds the latest release reproducibly from its own Cargo.lock; re-pin to a --version once a CVSS-4.0-capable rustsec build is chosen (audit F-45: the name no longer overclaims "version-pinned").
      - name: Run cargo-deny policy check (fail on high+)
        # deny.toml sets [advisories] vulnerability = "deny" (advisories), plus bans/licenses/
        # sources policy. --all-features so optional-feature-gated deps are scanned.
        run: |
          # cargo-deny >=0.18 dropped the post-`check` --config form; place the policy
          # next to the manifest so it is auto-discovered (robust across CLI changes).
          cp "${SUPPLY_CHAIN_DIR}/deny.toml" apps/desktop/src-tauri/deny.toml
          cargo deny \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --all-features \
            check \
            advisories bans licenses sources

  pip-audit:
    name: Python - pip-audit (PyPI advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install pip-audit (version-pinned)
        run: pip install "pip-audit==2.7.3"
      - name: Audit the engine requirements (fail on any advisory)
        # pip-audit exits non-zero on any known vulnerability. Advisory IDs to waive
        # (GHSA-/PYSEC-/CVE-) live one-per-line in pip-audit-ignore.txt and are passed
        # as --ignore-vuln. The hash-pinned CI requirements are the audited surface.
        run: |
          set -euo pipefail
          IGNORE_ARGS=""
          IGNORE_FILE="${SUPPLY_CHAIN_DIR}/pip-audit-ignore.txt"
          if [ -f "$IGNORE_FILE" ]; then
            while IFS= read -r line; do
              id="${line%%#*}"
              id="$(echo "$id" | tr -d '[:space:]')"
              [ -z "$id" ] && continue
              IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $id"
            done < "$IGNORE_FILE"
          fi
          echo "pip-audit$IGNORE_ARGS"
          pip-audit \
            --requirement engine/requirements-ci.txt \
            --strict \
            --progress-spinner off \
            $IGNORE_ARGS

  npm-audit:
    name: Node - npm audit (fail-closed high+ filter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Capture npm audit JSON
        working-directory: apps/desktop
        # `npm audit` exits non-zero when vulnerabilities exist; capture its JSON and
        # let the stdlib filter own the pass/fail decision. `|| true` keeps a non-zero
        # audit exit from aborting the step before the filter runs -- but the exit code
        # is RECORDED and handed to the filter, because `|| true` otherwise erases the
        # difference between "npm found nothing" and "npm never ran". `test -s` is no
        # backstop for that: npm's ERROR document is non-empty, valid JSON.
        run: |
          set -uo pipefail
          rc=0
          npm audit --json > npm-audit.json 2> npm-audit.err || rc=$?
          echo "$rc" > npm-audit.rc
          echo "npm audit exited $rc"
          if [ "$rc" != "0" ] && [ "$rc" != "1" ]; then
            echo "::error::npm audit did not run (exit $rc); stderr follows"
            cat npm-audit.err || true
          fi
          test -s npm-audit.json || { echo "npm produced no audit JSON"; exit 1; }
      - name: Enforce high+ threshold (honouring the allowlist)
        # The filter is fail-closed on BOTH questions: did the audit actually RUN (npm
        # exit code + npm error document + recognised v6/v7 shape + metadata
        # cross-check), and did it find an un-waived high/critical. Either -> exit 1.
        run: |
          python "${SUPPLY_CHAIN_DIR}/npm_audit_filter.py" \
            apps/desktop/npm-audit.json \
            --allow "${SUPPLY_CHAIN_DIR}/npm-audit-allow.txt" \
            --threshold high \
            --npm-exit-code "$(cat apps/desktop/npm-audit.rc)"

  sbom:
    name: SBOM - CycloneDX (rust + npm + python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # Nine crates rebuilt from zero in every job that touches cargo: no workflow
      # cached anything, measured with `grep -c "rust-cache|~/.cargo" .github/workflows/*.yml`
      # returning 0 in all eleven files. Placed AFTER the toolchain step, not after
      # checkout: the plugin keys its cache on the CURRENT rustc version, so a cache
      # taken before the toolchain is selected is keyed on the runner's preinstalled
      # compiler and never hits. That is upstream's own instruction at this sha.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install CycloneDX generators (version-pinned)
        run: |
          cargo install cargo-cyclonedx --version 0.5.7 --locked
          pip install "cyclonedx-bom==4.6.1"
      - name: Generate SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom
          # Rust: CycloneDX SBOM for the Tauri host workspace.
          cargo cyclonedx \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --format json
          # cargo-cyclonedx writes <crate>.cdx.json next to each manifest; collect them.
          find apps/desktop/src-tauri -name "*.cdx.json" -exec cp {} sbom/ \;
          # npm: generate from the lockfile only (no install needed) via the pinned
          # CycloneDX npm generator.
          npx --yes @cyclonedx/cyclonedx-npm@1.19.3 \
            --package-lock-only \
            --output-format JSON \
            --output-file sbom/npm.cdx.json \
            apps/desktop/package-lock.json
          # Python: SBOM from the hash-pinned engine requirements.
          cyclonedx-py requirements engine/requirements-ci.txt \
            --output-format JSON \
            --outfile sbom/python.cdx.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: cyclonedx-sbom
          path: sbom/
          if-no-files-found: error

  action-pins:
    name: Action pins - consistency gate (F-46)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Stdlib only, no network. A SHA pin is only wrong RELATIVE to other pins, so nothing else
      # in CI could see this: release.yml carried actions/setup-PYTHON's commit under
      # actions/setup-node, which GitHub cannot resolve, so every `v*` tag push died at that step
      # and no installer was ever produced. This gate holds one action to one pin and — the rule
      # that catches it — one commit to one action.
      - name: Action pin consistency gate
        run: python tools/check_action_pins.py
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_action_pins

  release-signing:
    name: Release signing + updater - fail-closed coupling gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Stdlib only, no network, NO secrets - this job never sees signing material; it checks
      # that the two halves of "signed, updatable build" can only move together. The failure
      # it catches is silent by nature: a signing key set in CI with no `plugins.updater`
      # config makes Tauri emit no updater payload at all, so the key is never used, the job
      # is green, and every installed app is permanently un-updatable. It also refuses a
      # placeholder pubkey (verification against a key nobody controls) and holds the Owner-
      # secret list identical across the gate, release.yml and docs/RELEASE_SETUP.md.
      - name: Release signing / updater coupling gate
        run: python tools/check_release_signing.py
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_release_signing

  residual-items:
    name: Residual engine items O-1..O-5 - inventory gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Stdlib only. Phase 10's exit criteria include "O-1..O-5 closed or owner-signed-
      # deferred" - but before this gate the five items existed only as one-line summaries
      # scattered across CLAUDE.md, docs/SECURITY_MODEL.md, the roadmap and PROJECT_STATE.md,
      # with no single place saying what any of them actually requires. An accepted HIGH
      # cannot be tracked by prose that drifts. This holds docs/PHASE_10_PRODUCTION_ITEMS.md
      # to a complete inventory (every item: severity, code site, status, what closure needs)
      # and to the severities the other canonical docs assert.
      - name: Residual-items inventory gate
        run: python tools/check_residual_items.py
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_residual_items

  reachability:
    name: Reachability - nothing implemented-and-uncalled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Stdlib only, no network. Five separate times this week the same defect shipped:
      # something implemented that nothing calls - a capability policy with no enforcement,
      # 262 agent definitions the app could not see, two backend commands with no frontend
      # wrapper, five engine security functions with zero callers. Every one read as
      # protection while doing nothing, and every one was found by a human audit, because a
      # gate that checks a thing EXISTS cannot tell you the thing is REACHED. This makes
      # reachability a checked claim: every registered #[tauri::command] is invoked from
      # apps/desktop/src/** or declared in config/reachability-declarations.json WITH A
      # WRITTEN REASON; the security-critical engine symbols named in
      # docs/PHASE_10_PRODUCTION_ITEMS.md carry an expectation the gate defends in BOTH
      # directions (a caller that disappears is red, and so is an exception that outlives the
      # condition it described); and capability grants must correspond to registered commands.
      # Unreachable is often correct - unreachable-AND-undeclared is the defect. The gate
      # prints its own limits on every run (a static scan: dynamic dispatch slips past)
      # because a gate that overstates its coverage is the same lie one level up.
      # See docs/REACHABILITY_GATE.md.
      - name: Reachability gate
        run: python tools/check_reachability.py
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_reachability

  runbook-snippets:
    name: Runbooks - pasted Python matches the code it calls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # docs/DEBIAN_DEPLOYMENT.md tells an operator to paste Python at a
      # root shell on a box that is mid-deployment. One of those snippets called
      # assert_control_plane_not_writable with one argument when it takes two, and it was found by
      # a person running it - after the step had already mounted something - rather than by anyone
      # reading it. Prose about code drifts silently; pasted code that drifts fails in the reader's
      # hands. This parses every snippet and checks each call against the real signature, so a
      # renamed or re-signatured engine function turns THIS red instead of the operator's terminal.
      # It is arity and syntax only, and says so on every run: it cannot tell you a snippet does
      # the right thing, only that it will not die on the first line.
      # Unlike its sibling gates this one is NOT stdlib-only: it imports the engine modules the
      # snippets call, in order to compare each call against the real signature, and those modules
      # import cryptography. Reading signatures out of the source text instead would be stdlib-only
      # and would also be a second, weaker parser of the same thing — the value here is that the
      # comparison is against the module that actually loads at runtime.
      - name: Install engine CI dependencies
        run: pip install --require-hashes -r engine/requirements-ci.txt
      - name: Runbook snippet gate
        run: python tools/check_runbook_snippets.py
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_runbook_snippets

  gitleaks:
    name: Secrets - gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so the PR-range secret scan can walk every commit in the
          # branch, not just the tip tree.
          fetch-depth: 0
      - name: Install gitleaks (version-pinned, checksum-verified)
        # Download the pinned release tarball AND the release's own SHA256SUMS, then
        # verify the tarball against it. Pins the exact version; integrity is anchored
        # to the release artifact rather than a floating action tag.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${BASE}/${TARBALL}" -o "$TARBALL"
          curl -sSfL "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${TARBALL}\$" checksums.txt | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan the working tree for secrets (fail on any leak)
        run: |
          set -o pipefail
          gitleaks detect \
            --source . \
            --no-git \
            --config "${SUPPLY_CHAIN_DIR}/gitleaks.toml" \
            --redact \
            --no-banner \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks.json" \
            --exit-code 0
          echo "--- gitleaks findings (RuleID | File) ---"
          python3 -c "import json,sys;d=json.load(open(sys.argv[1]));[print(x.get('RuleID'),'|',x.get('File'),'| line',x.get('StartLine')) for x in d];sys.exit(1 if d else 0)" "$RUNNER_TEMP/gitleaks.json"
      - name: Scan the PR commit range for secrets
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # NOTE (audit F-20): `--no-git` forces a filesystem scan and makes `--log-opts` a no-op, so this
          # step never actually walked the commit range — a secret introduced then removed within the PR
          # was invisible. Removing `--no-git` DOES fix that (verified: the range scan then walks all
          # BASE..HEAD commits), but it currently surfaces 9 PRE-EXISTING historical findings across this
          # branch's 122-commit history (test/demonstration keys + committed public anchors + high-entropy
          # hex in docs). Those must first be TRIAGED (real vs. false-positive) and then remediated in
          # history or exempted in .github/supply-chain/gitleaks.toml — and gitleaks.toml is an
          # owner-owned do-not-touch file (audit F-47). So the real history scan is an OWNER-GATED
          # follow-up; `--no-git` stays for now to keep the wall green, with the gap documented here
          # rather than hidden. The working-tree scan step above IS effective and gates the current tree.
          gitleaks detect \
            --source . \
            --no-git \
            --config "${SUPPLY_CHAIN_DIR}/gitleaks.toml" \
            --log-opts "${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --no-banner \
            --exit-code 1
