name: release

# Tag-triggered SIGNED-installer build (v*). Does NOT run on PRs/pushes — so it never gates
# day-to-day CI.
#
# FAIL-CLOSED BY CONSTRUCTION. This workflow cannot produce a release artifact unless the
# Owner's signing material is present. The `preflight` job runs
# `tools/check_release_signing.py --require-release-ready`, which refuses — loudly, naming
# every missing secret and every missing half of the updater configuration — when anything
# is absent. `build` declares `needs: preflight`, so a refusal stops the release before
# `npm ci`, before the bundle, before anything is uploaded.
#
# This replaces the previous behaviour, where a missing key merely bypassed the signing step
# and the job still published a draft release. That is the exact silent-failure mode this
# repository's audits keep finding: a green check over a build nobody can trust or update.
# To smoke-test the bundle locally without secrets, run `npm run tauri build` in
# `apps/desktop` — CI is for releases, and a release is signed.
#
# A production release is ADDITIONALLY gated by the fail-closed RELEASE GATE in
# docs/RELEASE_SETUP.md §5 (code-audit GREEN + governed chain running + 3b-2/3b-3). That gate
# is a human/audit judgement and is enforced before tagging, not by this file.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------------------
  # The refusal. Nothing builds until this passes.
  # ---------------------------------------------------------------------------------------
  preflight:
    name: Release preflight - fail closed without the Owner's signing material
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      # The gate is only worth what its own tests are worth; run them here too, so a broken
      # gate cannot silently pass a release.
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_release_signing

      # Secret NAMES are mapped in; the script only ever reports which names are empty, never
      # a value or any prefix of one.
      - name: Refuse unless every Owner secret and the updater configuration are present
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python tools/check_release_signing.py --require-release-ready

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux bundle deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # The SHA below is actions/setup-node v4.1.0 — the SAME pin every other workflow in this
      # repo uses (ci.yml, a11y.yml, perf-budget.yml, supply-chain.yml). It previously carried
      # 0b93645e9fea7318ecaed2b359559ac225c90a2b, which is actions/setup-PYTHON's v5.3.0 commit:
      # a commit that does not exist in the setup-node repository, so GitHub could not resolve the
      # action and every `v*` tag push failed here — before `npm ci`, before the bundle, before the
      # signing step. No installer has ever been produced by this workflow (independent audit F-46).
      # The trailing comment is the human-auditable half of a SHA pin, so it must name the action's
      # real version; copying a pin between actions defeats the review value of pinning at all.
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      # Windows Authenticode. The certificate thumbprint is NOT committed to tauri.conf.json:
      # a thumbprint in the repo names a certificate the runner may not hold, and Tauri then
      # emits an unsigned binary while the job stays green. Instead the real thumbprint is
      # derived from the certificate the Owner actually supplied, at build time, and merged
      # into the config with `--config`.
      - name: Import the Owner's Windows Authenticode certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'brops-codesign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfxPath -Force
          if (-not $cert.Thumbprint) { throw 'RELEASE REFUSED: the imported certificate has no thumbprint.' }
          $overlayPath = Join-Path $env:RUNNER_TEMP 'tauri.signing.windows.json'
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint } } } |
            ConvertTo-Json -Depth 6 | Set-Content -Path $overlayPath -Encoding utf8
          "TAURI_WINDOWS_CONFIG_OVERLAY=$overlayPath" >> $env:GITHUB_ENV

      # PINNED (audit F-15). This step is handed the Tauri updater signing key and its
      # password, four Apple signing/notarization secrets and a `contents: write`
      # GITHUB_TOKEN, and it builds the installer the Owner runs. It was the ONLY `uses:`
      # in the repository resolving a MUTABLE tag: whoever can move `tauri-apps/tauri-action`'s
      # `v0` tag could have run their own code inside that secret set, on the release commit,
      # with write access to the release.
      #
      # Provenance of this SHA (resolved 2026-08-10 against the live GitHub API, NOT guessed):
      #   gh api repos/tauri-apps/tauri-action/git/ref/tags/v0
      #     -> {"object": {"sha": "fce9c610…", "type": "tag"}}          # annotated tag object
      #   gh api repos/tauri-apps/tauri-action/git/tags/fce9c610…
      #     -> {"object": {"sha": "84b9d35b…", "type": "commit"}}       # dereferenced commit
      #   gh api repos/tauri-apps/tauri-action/tags --jq '…sha=="84b9d35b…"…'
      #     -> v0.6.2, v0.6, v0, action-v0.6.2
      # So this pin is exactly what `@v0` resolved to at the moment of pinning — behaviour is
      # unchanged, the mutability is gone. Note upstream has since published `action-v1.0.0`
      # on a different commit; moving to it is a version bump for the Owner to make, not
      # something a pinning change should smuggle in.
      - name: Build + bundle (signed; the preflight guarantees the material is present)
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (docs/RELEASE_SETUP.md §3). The PUBLIC half lives in
          # tauri.conf.json `plugins.updater.pubkey`; the preflight refuses if either is absent.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization (docs/RELEASE_SETUP.md §2).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'BroPS ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.platform == 'windows-latest' && format('--config {0}', env.TAURI_WINDOWS_CONFIG_OVERLAY) || '' }}

      # ---- post-build verification: prove the artifacts are actually signed ----------------
      # tauri-action succeeding is not evidence of a signature: an absent certificate, a
      # thumbprint that matches nothing in the store, or updater artifacts that were never
      # requested all leave a green step behind. These checks read the produced bytes.

      - name: Verify every updater payload carries a signature
        shell: bash
        run: |
          python tools/check_release_signing.py \
            --verify-updater-signatures apps/desktop/src-tauri/target/release/bundle

      - name: Verify the Windows installers are Authenticode-signed
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'apps/desktop/src-tauri/target/release/bundle'
          $installers = Get-ChildItem -Path $root -Recurse -Include *.exe,*.msi -File
          if (-not $installers) { throw 'RELEASE REFUSED: no Windows installer was produced.' }
          $bad = @()
          foreach ($f in $installers) {
            $sig = Get-AuthenticodeSignature -FilePath $f.FullName
            if ($sig.Status -ne 'Valid') { $bad += "$($f.Name): $($sig.Status)" }
          }
          if ($bad) { throw "RELEASE REFUSED: invalidly-signed installer(s): $($bad -join '; ')" }
          Write-Host "OK: $($installers.Count) Windows installer(s) carry a valid Authenticode signature."

      - name: Verify the macOS bundle is signed and notarization-accepted
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          root=apps/desktop/src-tauri/target/release/bundle
          app="$(find "$root" -maxdepth 3 -name '*.app' -type d | head -n 1)"
          if [ -z "$app" ]; then
            echo "RELEASE REFUSED: no .app bundle was produced." >&2
            exit 1
          fi
          codesign --verify --strict --deep --verbose=2 "$app"
          # Gatekeeper's own verdict — this is what a user's machine will run.
          spctl --assess --type execute --verbose=4 "$app"
