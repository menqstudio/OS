name: a11y

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

# Frontend accessibility gate: runs axe (via jest-axe) over rendered components in
# jsdom. Fail-closed — a WCAG 2 A/AA violation in the shared UI primitives cannot
# merge. Mirrors the cockpit-frontend job in ci.yml (same Node, same SHA-pinned
# actions, same working-directory) but invokes only the dedicated a11y project.
jobs:
  cockpit-a11y:
    name: Cockpit · frontend accessibility (axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run test:a11y
