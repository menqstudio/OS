name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `edited` and `ready_for_review` are REQUIRED: the exact audited head is anchored out-of-band in
    # the PR body (`AUDIT_CANDIDATE_HEAD: <sha>`). A body edit must start a fresh repo-state run so the
    # exact-head check re-reads the marker — the default pull_request trigger does NOT fire on `edited`.
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  contents: read

# One run per ref, EXCEPT on `main`.
#
# `cancel-in-progress: true` would be wrong on `main` and the reason is a rule this
# repository now gates on: after every merge the head's own run must be READ
# (`gh run list --branch main`, never a pull request's checks). Two merges close
# together share the group `ci-refs/heads/main`, so the second would cancel the
# first — and a CANCELLED run is not a reading. It is not `success`, it is not
# `failure`, and `main_ci` in the machine mirror would have nothing true to record.
#
# On a pull request `github.ref` is `refs/pull/<n>/merge`, so each PR keeps its own
# group and a new push still cancels the run it superseded, which is the whole point.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Phase 0: each half builds and tests independently. A cross-integration
# (bridge) smoke test is added in Phase 1.
jobs:
  cockpit-frontend:
    name: Cockpit · frontend (typecheck + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  cockpit-core:
    name: Cockpit · SQLite data core (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # Nine crates rebuilt from zero in every job that touches cargo: no workflow
      # cached anything, measured with `grep -c "rust-cache|~/.cargo" .github/workflows/*.yml`
      # returning 0 in all eleven files. Placed AFTER the toolchain step, not after
      # checkout: the plugin keys its cache on the CURRENT rustc version, so a cache
      # taken before the toolchain is selected is keyed on the runner's preinstalled
      # compiler and never hits. That is upstream's own instruction at this sha.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Test the SQLite data core
        run: cargo test -p brops-core --manifest-path apps/desktop/src-tauri/Cargo.toml

  governed-crates:
    name: Governed chain · production crates (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # (remediation audit) 52 `#[test]` functions in the crates that ACTUALLY produce a
      # trusted_verified — the setuid launcher, the contained executor, the broker chain and the
      # live driver — were run by no CI job at all, and `brops-executor` was never even compiled.
      # `brops-core` alone was tested, which is the crate least able to forge anything. A test
      # that no job runs is not a test; it is a file that resembles one.
      #
      # The Tauri host crate (`brops`) is deliberately NOT here: it needs webkit2gtk. Its absence
      # is a real coverage gap on Windows and is tracked separately — it is stated rather than
      # papered over by testing something adjacent and calling it covered.
      # Nine crates rebuilt from zero in every job that touches cargo: no workflow
      # cached anything, measured with `grep -c "rust-cache|~/.cargo" .github/workflows/*.yml`
      # returning 0 in all eleven files. Placed AFTER the toolchain step, not after
      # checkout: the plugin keys its cache on the CURRENT rustc version, so a cache
      # taken before the toolchain is selected is keyed on the runner's preinstalled
      # compiler and never hits. That is upstream's own instruction at this sha.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Test the launcher, executor, broker and live driver
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml             -p brops-launcher -p brops-executor -p brops-broker -p brops-governed-live             -p brops-win-live -p brops-win-broker
      # The provisioning preflight is a REPORT, and a report nothing runs is the
      # T-056 pattern -- a control whose failure prevents nothing. This is what
      # runs it. It also asserts something worth asserting: on an unprovisioned
      # machine the governed gate must still be SHUT. A runner that ever came
      # back ready would mean the fail-closed ladder had been provisioned by
      # accident, and that must redden CI rather than pass quietly.
      - name: Provisioning preflight reports the governed gate SHUT on a bare runner
        run: |
          set +e
          out=$(cargo run --quiet --manifest-path apps/desktop/src-tauri/Cargo.toml \
                  -p brops-broker --bin brops-preflight 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "RED: the preflight reports this runner READY for a governed turn."
            echo "Either the ladder was provisioned here, or the preflight stopped measuring."
            exit 1
          fi
          echo "$out" | grep -q "env.brops_broker_config" || {
            echo "RED: the report no longer names env.brops_broker_config, the refusal that holds on every shipped install."
            exit 1
          }
          echo "GREEN: preflight exit $code, the gate is shut and it says which requirements are unmet."

  live-governed-turn:
    name: Linux · LIVE 7-service governed turn (real uids, setuid launcher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # `engine/ci/live/run_live_turn.sh` is the ONLY thing that exercises the real OS trust
      # boundary: six dedicated uids, AF_UNIX + SO_PEERCRED peer auth, per-service key custody
      # modes, and the privileged recorder → setuid launcher → contained executor spawn. Until now
      # nothing re-ran it — `CURRENT_LINUX_E2E: proven` rested on a single manual run that no gate
      # reproduced (independent audit, ci-tests section). A hosted ubuntu runner has everything the
      # script asks for: passwordless sudo, useradd, setuid on ext4, /opt, and sudoers.d.
      # Nine crates rebuilt from zero in every job that touches cargo: no workflow
      # cached anything, measured with `grep -c "rust-cache|~/.cargo" .github/workflows/*.yml`
      # returning 0 in all eleven files. Placed AFTER the toolchain step, not after
      # checkout: the plugin keys its cache on the CURRENT rustc version, so a cache
      # taken before the toolchain is selected is keyed on the runner's preinstalled
      # compiler and never hits. That is upstream's own instruction at this sha.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install engine crypto dependency
        run: pip install --require-hashes -r engine/requirements-ci.txt
      - name: Build the live-turn binaries (launcher + recorder/executor/driver)
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml -p brops-launcher -p brops-governed-live
      # The script documents these accounts as "already provisioned on the box"; on an ephemeral
      # runner we provision them here. Fixed uids so a failure is legible against the design's
      # §0 principal table. `--no-create-home` keeps them without a traversable home, which is the
      # posture the design assumes.
      - name: Provision the six service accounts
        run: |
          set -eu
          for spec in \
            "brops-verifier_broker:5001" \
            "brops-challenge:5002" \
            "brops-supervisor:5004" \
            "brops-recorder:5005" \
            "brops-signer:5006" \
            "brops-executor:5007" ; do
            user="${spec%%:*}"; uid="${spec##*:}"
            sudo groupadd -g "$uid" "$user"
            sudo useradd -u "$uid" -g "$uid" -M --no-create-home -s /usr/sbin/nologin "$user"
          done
          id brops-verifier_broker; id brops-executor
      # Fail-closed by construction: the script exits non-zero unless the driver prints
      # `production_verified=true bound=true`, and it never fabricates an acceptance. A RED here
      # means the live chain is broken — which is exactly what this job exists to surface.
      # Invoked through `bash` rather than as an executable: the script is tracked 100644 (it was
      # only ever run by hand on a provisioned box), and relying on the mode bit would make this
      # gate depend on a checkout detail rather than on the chain it is meant to prove.
      - name: Run ONE live governed turn end to end
        run: sudo -E env "PATH=$PATH" bash engine/ci/live/run_live_turn.sh

  ladder-governed-turn:
    name: Linux · §4.10(g) LADDER round trip (adapter → real supervisor → real contained execution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # `live-governed-turn` above proves the §5 chain: the five `op` lifecycle messages over
      # direct AF_UNIX, from the broker uid. It never sends a §4.10(a0)/(a)(b)(c)/(d) frame and
      # never touches the bridge adapter, so it cannot be cited for "one governed round trip,
      # adapter ↔ real supervisor" — that substitution is what made the roadmap box false once.
      #
      # `engine/tests/test_governed_turn_submit_e2e.py` proves the other half — the whole §4.10(g)
      # ladder against the real services — but its §6.1 step-5 contained execution is a stand-in,
      # because that step needs Linux, six uids and a setuid launcher.
      #
      # THIS job is the intersection, and it is the only thing in the tree that is: the real
      # one-shot sidecar subprocess, from a SEVENTH principal, driving the real supervisor
      # services, reaching the real privileged recorder → setuid launcher → contained executor,
      # recording the evidence, and exiting non-zero unless the round trip completed.
      # Nine crates rebuilt from zero in every job that touches cargo: no workflow
      # cached anything, measured with `grep -c "rust-cache|~/.cargo" .github/workflows/*.yml`
      # returning 0 in all eleven files. Placed AFTER the toolchain step, not after
      # checkout: the plugin keys its cache on the CURRENT rustc version, so a cache
      # taken before the toolchain is selected is keyed on the runner's preinstalled
      # compiler and never hits. That is upstream's own instruction at this sha.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install engine crypto + schema dependencies
        run: pip install --require-hashes -r engine/requirements-ci.txt
      # `ladder_output_pull` is the §4.10(f) DESKTOP half: it lives in `brops-core`, the crate that
      # owns `pull_output`, the chunk arithmetic and the §4.6/§7.1 output gate. It is built here
      # rather than only inside the script for the same reason the other three are — a compile
      # error should fail as a build step, not as a mid-run "FAIL: build" after root has already
      # provisioned /opt/brops-live.
      - name: Build the launcher + the governed-live crate (recorder/executor) + the §4.10(f) pull driver
        # Two invocations: `--bin` filters the WHOLE command, so naming three packages and one bin
        # builds only that bin. Run 31617346101 finished in 0.11s and produced no launcher.
        run: |
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml -p brops-launcher -p brops-governed-live
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml -p brops-core --bin ladder_output_pull
      # SEVEN accounts, not six. §2.6 requires the broker and the sidecar to be pairwise-distinct
      # principals, and `governed_supervisor_server.handle_connection` refuses outright when the
      # two uids are equal — so on the six-account kit every open/staging/evidence/read gate,
      # all of which demand the SIDECAR uid, is unreachable by construction. 5003 is the gap in
      # the §0 principal table, where the design lists `brops-sidecar` between `brops-challenge`
      # and `brops-supervisor`.
      - name: Provision the seven service accounts
        run: |
          set -eu
          for spec in \
            "brops-verifier_broker:5001" \
            "brops-challenge:5002" \
            "brops-sidecar:5003" \
            "brops-supervisor:5004" \
            "brops-recorder:5005" \
            "brops-signer:5006" \
            "brops-executor:5007" ; do
            user="${spec%%:*}"; uid="${spec##*:}"
            sudo groupadd -g "$uid" "$user"
            sudo useradd -u "$uid" -g "$uid" -M --no-create-home -s /usr/sbin/nologin "$user"
          done
          id brops-sidecar; id brops-supervisor
      # Fail-closed by construction. `ladder_evidence.py` exits non-zero unless the §4.6 frame
      # says `ok`, its §4.9 envelope verifies under the manifest-resolved production key, the
      # signed `request_sha256` is the recomputation over this turn's three staged digests, the
      # supervisor's own ledger says COMPLETED, and the recorder's containment report says the
      # launcher exited 0. The script ALSO drives the same verifier, in the same mode, against a
      # deliberately broken input and requires it to go RED with `digest_mismatch` — so the
      # failing branch is exercised on every run rather than reasoned about.
      #
      # Since 2026-08-12 the same run also PULLS THE OUTPUT BACK through §4.10(f) — the egress
      # half, which §4.10(g)'s submit subprocess deliberately never touches — and requires four
      # negative controls to be refused BY NAME: `stream_unknown` and `stream_binding_mismatch`
      # from the supervisor, and `digest_mismatch` / `length_mismatch` from the desktop's
      # §4.6/§7.1 whole-output gate against the SIGNED envelope. `ladder_evidence.py` then pairs
      # the driver's transcript with the supervisor's own hop log, so "the bytes came through the
      # egress" rests on SO_PEERCRED uids the driver cannot write rather than on its own account.
      - name: Drive ONE §4.10(g) round trip + the §4.10(f) output pull through the real ladder
        run: sudo -E env "PATH=$PATH" "LADDER_EVIDENCE_OUT=$RUNNER_TEMP/ladder-evidence" bash engine/ci/live/run_ladder_turn.sh
      # Uploaded on failure too: a RED run's evidence bundle is the thing worth reading, and a
      # verdict nobody can inspect is a claim rather than a proof.
      - name: Upload the recorded evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ladder-governed-turn-evidence
          path: ${{ runner.temp }}/ladder-evidence
          if-no-files-found: error

  cockpit-host:
    name: Cockpit · Tauri host (cargo check + ai tests)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # Nine crates rebuilt from zero in every job that touches cargo: no workflow
      # cached anything, measured with `grep -c "rust-cache|~/.cargo" .github/workflows/*.yml`
      # returning 0 in all eleven files. Placed AFTER the toolchain step, not after
      # checkout: the plugin keys its cache on the CURRENT rustc version, so a cache
      # taken before the toolchain is selected is keyed on the runner's preinstalled
      # compiler and never hits. That is upstream's own instruction at this sha.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev
      - name: Compile the Tauri host crate
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Test the host crate (ai.rs governed/receipt unit tests)
        run: cargo test -p brops --manifest-path apps/desktop/src-tauri/Cargo.toml

  engine-windows:
    name: Engine · governance runtime on Windows (python)
    runs-on: windows-latest
    env:
      BRO_ENV: ci
      BRO_OPERATOR_ROOT_PUBKEY: 7231f58d738616115dcd2a71502360331076465f253b3723c8db9be01361df3c
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # The engine suite ran on ubuntu only, so every `skipUnless(os.name == "nt")` test in it
      # executed in NO job at all. That is not a hypothetical gap: the one test proving the O-1
      # writability probe answers by ATTEMPTING A CREATE rather than by reading permission bits —
      # the sentence the whole check is built on — is Windows-only, because POSIX `os.access` and a
      # real create agree for every case a non-root Linux test can construct. It disagrees on
      # Windows ACLs, which is exactly why the test exists, and exactly where nothing ran it.
      # Deleting the create probe and substituting os.access passed the entire suite on Linux.
      # This job is the second platform, not a duplicate of the first.
      - name: Install engine CI dependencies
        run: pip install --require-hashes -r requirements-ci.txt
      # -v, unlike the ubuntu job. This job exists BECAUSE tests can run nowhere else, so what
      # skipped here is the thing worth reading: a skip is a hole unless somebody counts them,
      # and a count with no names cannot be audited. It also settles a question this job has
      # already raised once — a Windows custody test failed on one run and passed on the next
      # with no change to its behaviour, and a bare pass/fail line could not say whether the
      # second run proved the rule or merely declined to test it.
      - name: Run the engine test suite on Windows
        run: python -B -m unittest discover -s tests -v

  trust-provisioning:
    name: Trust provisioning + audit signer (both platforms)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # These two crates mint and police this deployment's entire trust root, and until now they
      # ran in NO job on either platform - every property they establish was gated on somebody
      # remembering to run cargo by hand. A single Debian run then found: a umask-dependent pin
      # mode that made the real Python verifier refuse the store, a POSIX custody probe that could
      # never return Ok on any machine, and the same probe letting the registry directory through
      # unchecked on Windows. Nine of the sixteen mutations from that round are GREEN on Windows
      # and RED on Linux, so ONE platform is not coverage - the matrix is the point, not a luxury.
      #
      # The FIRST run of this job then found four more, and every one of them was about the
      # machine rather than the code:
      #
      #   * ubuntu had no directory owned by another uid, so the one test that proves a POSIX
      #     anchor is out of this account's reach could not run. That is provisioned below.
      #   * windows ran as an ELEVATED administrator. Every O-2 property is a claim about what
      #     THIS account cannot reach, and an elevated token holds SeTakeOwnership/SeRestore and
      #     sits inside the BUILTIN\Administrators ACE those descriptors carry, so ten tests were
      #     measuring a claim that is simply false on that token - which the product itself
      #     reports as Separation::SeparatedUntilElevation. The Windows leg therefore runs the
      #     test binaries as a STANDARD LOCAL ACCOUNT created below. That is not a workaround: it
      #     is the posture the product is specified against ("the application must run
      #     unelevated"), and it is the first time the Separation::Separated branch has been
      #     exercised anywhere.
      #   * `sc.exe create` had never been run by anything, and its argument vector was wrong
      #     (`start= auto` as ONE argv element). Fixed in `register.rs`, with unit tests on the
      #     argv shape that run on both platforms.
      #   * the cross-language encoder proof fed Python through `sys.stdin.read()`, whose encoding
      #     on Windows is the process code page. It compared cp1252 mojibake with UTF-8 and called
      #     it a drift. The transport now states its bytes at both ends.
      #
      # `python_verifier.rs` runs the REAL engine verifiers against the REAL Rust output, so the
      # dependency is not optional: that test FAILS rather than skips when cryptography is absent,
      # which is deliberate - a skip there would hide a byte-level divergence between the two
      # sides of the trust chain.

      # ---------------------------------------------------------------------------------------
      # Windows: the account, and the machine facts it needs. FIRST, because the ACL grant below
      # is inherited by everything cargo writes afterwards - doing it after the build would mean
      # re-permissioning a multi-gigabyte target directory.
      # ---------------------------------------------------------------------------------------
      - name: Create the standard account the Windows custody proofs are measured on
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A throwaway password: it exists for CreateProcessWithLogonW and nothing else, it is
          # masked out of the log, and the account is removed in the last step of this job.
          $password = 'Br0ps-' + [guid]::NewGuid().ToString('N') + '!'
          Write-Host "::add-mask::$password"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name 'brops-ci' -Password $secure -PasswordNeverExpires `
              -AccountNeverExpires -UserMayNotChangePassword `
              -Description 'BroPS CI: unprivileged custody-proof user' | Out-Null
          Add-LocalGroupMember -Group 'Users' -Member 'brops-ci'
          "BROPS_CI_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Developer Mode. `a_symlink_inside_the_anchor_is_refused_rather_than_followed` needs to
          # CREATE a symlink to have a fixture at all, and a standard account holds no
          # SeCreateSymbolicLinkPrivilege. This is the supported way to grant it without handing
          # the account a privilege that would also let it walk past other checks.
          $unlock = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $unlock -Force | Out-Null
          New-ItemProperty -Path $unlock -Name 'AllowDevelopmentWithoutDevLicense' -Value 1 `
              -PropertyType DWord -Force | Out-Null

          # Traversal down to the workspace, then read+execute over it. Inheritable, so the target
          # directory cargo creates in the next steps carries the same grant without a second pass.
          function Grant-Read([string]$target, [string]$spec) {
            icacls $target /grant "brops-ci:$spec" /T /C /Q | Out-Null
            if ($LASTEXITCODE -ne 0) {
              # /C already means "carry on past individual failures"; a partial grant would show
              # up as an unreadable file in the run below, so say so here rather than let that be
              # the first anyone hears of it.
              Write-Host "::warning::icacls $target returned $LASTEXITCODE - some entries may not carry the grant"
            }
            $global:LASTEXITCODE = 0
          }
          $path = $env:GITHUB_WORKSPACE
          while ($path) {
            icacls $path /grant 'brops-ci:(RX)' /C /Q | Out-Null
            $global:LASTEXITCODE = 0
            $parent = Split-Path $path -Parent
            if (-not $parent -or $parent -eq $path) { break }
            $path = $parent
          }
          Grant-Read $env:GITHUB_WORKSPACE '(OI)(CI)(RX)'

          # Measured, not assumed. The entire point of this account is that it is NOT an
          # administrator; if it were, this leg would reproduce the elevated-token run it exists
          # to replace and every custody assertion in it would be vacuous.
          $admins = @(Get-LocalGroupMember -Group 'Administrators' | ForEach-Object { $_.Name })
          if ($admins -match 'brops-ci') {
            throw "brops-ci ended up in BUILTIN\Administrators: $($admins -join ', ')"
          }
          Write-Host "brops-ci is a member of Users and not of Administrators ($($admins -join ', '))"
          exit 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # Nine crates rebuilt from zero in every job that touches cargo: no workflow
      # cached anything, measured with `grep -c "rust-cache|~/.cargo" .github/workflows/*.yml`
      # returning 0 in all eleven files. Placed AFTER the toolchain step, not after
      # checkout: the plugin keys its cache on the CURRENT rustc version, so a cache
      # taken before the toolchain is selected is keyed on the runner's preinstalled
      # compiler and never hits. That is upstream's own instruction at this sha.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install the engine dependencies the cross-language proof needs
        run: pip install --require-hashes -r engine/requirements-ci.txt

      # ---------------------------------------------------------------------------------------
      # Linux: the one fixture POSIX gives no unprivileged way to build.
      # ---------------------------------------------------------------------------------------
      # `a_sealed_anchor_refuses_this_accounts_own_writes` needs a directory owned by a uid this
      # process is NOT, with every ancestor likewise. An owner may always chmod what it owns, so
      # there is no in-process construction of one and the guard fails naming exactly this. The
      # runner has passwordless sudo, so the runner is what was missing.
      #
      # The FILE inside it is not decoration and was the second half of the same finding: an empty
      # root-owned directory passes the ownership walk and then falls through to the skip, because
      # `prove_unwritable`'s open-for-write probe has nothing to be asked about. A real Debian run
      # hit exactly that.
      #
      # The `registry/config` subtree is deliberate too. `probe_tree` recurses, and the defect
      # that made it recurse - a non-recursive probe that let `<anchor>/registry` through
      # unchecked - is only measured by a fixture that HAS a subdirectory. This one is the shape
      # of the real anchor.
      - name: Provision the foreign-owned trust anchor the POSIX custody proof needs
        if: runner.os == 'Linux'
        run: |
          set -eu
          if [ "$(id -u)" -eq 0 ]; then
            echo "this job must not run as root: root rewrites any file regardless of owner or" \
                 "mode, so no directory on this machine would be out of its reach and every" \
                 "custody assertion below would be vacuous" >&2
            exit 1
          fi
          root=/var/lib/brops-ci-foreign-anchor
          sudo install -d -o root -g root -m 0755 "$root"
          sudo install -d -o root -g root -m 0755 "$root/trust-anchor"
          sudo install -d -o root -g root -m 0755 "$root/trust-anchor/registry"
          sudo install -d -o root -g root -m 0755 "$root/trust-anchor/registry/config"
          printf '%064d\n' 0 \
            | sudo install -o root -g root -m 0644 /dev/stdin "$root/trust-anchor/operator-root.pub"
          printf '{"keys":[]}\n' \
            | sudo install -o root -g root -m 0644 /dev/stdin \
                "$root/trust-anchor/registry/config/trusted-keys.json"
          ls -lnR "$root"
          # Measured, not assumed: if this account CAN write it, the fixture is not one and the
          # tests below would be proving something about a directory they own.
          if touch "$root/trust-anchor/.probe" 2>/dev/null; then
            echo "uid $(id -u) can create files in $root/trust-anchor, so it is not foreign-owned" >&2
            exit 1
          fi
          echo "the fixture refuses this account's writes, which is what makes it a fixture"

      - name: Trust provisioning + audit signer (Linux)
        if: runner.os == 'Linux'
        env:
          # Route 1 of the two `prerequisites::sealed_anchor` accepts. Deliberately NOT the
          # production path (`/var/lib/brops-trust-anchor`): standing the real anchor up here
          # would change what `the_production_machine_root_has_an_ancestor_this_account_cannot_
          # rename` is measuring, and the fixture's job is to be a fixture.
          BROPS_TEST_FOREIGN_ANCHOR: /var/lib/brops-ci-foreign-anchor/trust-anchor
          # No declarations. Every prerequisite this leg needs is provided above, and an
          # undeclared missing one is a hard failure - see provision/tests/prerequisites/mod.rs.
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml \
            -p brops-provision -p brops-audit-signer --no-fail-fast -- --test-threads=1 --nocapture

      # ---------------------------------------------------------------------------------------
      # Windows: build as the runner, RUN as the standard account.
      # ---------------------------------------------------------------------------------------
      # Splitting the two is what keeps this simple. cargo, rustup and the registry cache live in
      # the runner's own profile and are no business of the account under test; what the account
      # under test needs is to be the one making the syscalls the custody proofs measure.
      - name: Build the trust-provisioning test binaries
        if: runner.os == 'Windows'
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml `
            -p brops-provision -p brops-audit-signer --no-run

      - name: Trust provisioning + audit signer (Windows, as a standard account)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $python = (Get-Command python).Source
          icacls (Split-Path $python -Parent) /grant 'brops-ci:(OI)(CI)(RX)' /T /C /Q | Out-Null
          $global:LASTEXITCODE = 0

          # Ask cargo which executables it just built rather than guessing at paths under
          # target/debug/deps, whose names carry a metadata hash.
          $exes = cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml `
                    -p brops-provision -p brops-audit-signer --no-run --message-format=json |
                  ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } } |
                  Where-Object { $_ -and $_.executable -and $_.profile.test } |
                  ForEach-Object { $_.executable } | Select-Object -Unique
          if (-not $exes) { throw 'cargo produced no test executables to run' }
          Write-Host "test executables to run as brops-ci:`n$($exes -join "`n")"

          $work = Join-Path $env:RUNNER_TEMP 'brops-standard-account-run'
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          # T-023, answered on its fourth occurrence by the ACL dump added for exactly this.
          #
          # The refusal was `BRO_OPERATOR_ROOT_PUBKEY_FILE must not be writable by non-owner
          # principals`, intermittent across #125, #132, #155 and #157 and cleared by a rerun each
          # time. With the ACE printed it stopped being ambiguous on the first firing:
          #
          #   [ace #3 grants FILE_WRITE_DATA, FILE_APPEND_DATA, DELETE
          #    (mask 0x001301BF, flags 0x10, INHERITED) to NT AUTHORITY\Authenticated Users (S-1-5-11)]
          #
          # INHERITED, and Authenticated Users. So the anchor really was writable by every
          # authenticated principal on the box, the check was RIGHT to refuse, and the defect is
          # here: this directory is created under RUNNER_TEMP and inherited its DACL, while the
          # `/grant` below only ADDED to it. The row named both candidate fixes and the evidence
          # chose this one -- the harness, not the check. Teaching the check to ignore inherited
          # ACEs would have made CI quiet by deleting the Windows half of O-2.
          #
          # `/inheritance:r` drops the inherited ACEs and `/grant:r` then states the whole DACL.
          # Only principals the custody check treats as owner-equivalent are granted, BY SID so a
          # non-English runner cannot miss them: SYSTEM (S-1-5-18) and BUILTIN\Administrators
          # (S-1-5-32-544) -- which is how the outer step, running as the runner admin, keeps its
          # access to the script it writes and the stdout it reads back. `brops-ci` is granted
          # because it has to create the fixtures, and it is the OWNER of everything it creates
          # here, which is the ACE the check skips. `$env:USERNAME` is deliberately NOT granted: an
          # explicit ACE for the runner admin would inherit onto operator-root.pub as a non-owner
          # write and reproduce this exact refusal one principal over.
          icacls $work /inheritance:r /grant:r `
            '*S-1-5-18:(OI)(CI)(F)' `
            '*S-1-5-32-544:(OI)(CI)(F)' `
            'brops-ci:(OI)(CI)(F)' /T /C /Q | Out-Null
          $global:LASTEXITCODE = 0

          # Verified, not assumed. A silent icacls failure would put the run straight back to the
          # intermittent refusal with no way to tell the two apart, which is the state this whole
          # change exists to leave behind.
          $acl = (icacls $work) -join "`n"
          $global:LASTEXITCODE = 0
          foreach ($bad in @('Authenticated Users', 'Everyone')) {
            if ($acl -match [regex]::Escape($bad)) {
              throw ("the work directory still grants '$bad' after /inheritance:r, so the anchor " +
                     "would inherit a non-owner write ACE and the custody check would refuse it. " +
                     "That is T-023 and it is a real refusal, not a flake. Full ACL:`n$acl")
            }
          }
          Write-Host "work-directory DACL (inheritance removed):`n$acl"

          # A batch file rather than an argument string: `Start-Process -Credential` builds a
          # fresh environment block for the new logon, so the variables have to be set on the
          # far side of it.
          # TEMP and TMP too. `Start-Process -Credential` builds a fresh environment block, but
          # it inherits the runner's TEMP, which lives under runneradmin's profile and is exactly
          # what a standard account cannot reach -- so `tempfile` failed with ACCESS_DENIED before
          # a single custody assertion ran. Point them at the work directory brops-ci was just
          # granted, so the fixtures land where the account under test can actually build them.
          $lines = @(
            '@echo off',
            "set TEMP=$work",
            "set TMP=$work",
            # LOCALAPPDATA too, and for the same reason: a fresh logon block still carries the
            # RUNNER's profile path, and brops-ci has never logged on interactively so it has no
            # profile of its own. `anchor_end_to_end`'s fixture builds the app-side store under
            # %LOCALAPPDATA%, so six tests died on create_dir_all before reaching a single
            # custody assertion. %ProgramData% is left alone deliberately -- a standard account
            # may create there, and that is the real machine-wide location the anchor uses.
            "set LOCALAPPDATA=$work\localappdata",
            "set APPDATA=$work\appdata",
            "set USERPROFILE=$work",
            "set BROPS_TEST_PYTHON=$python",
            # The three prerequisites this runner genuinely cannot provide, named one at a time
            # because there is no blanket form. Each is a hole with a reason:
            #
            #  installed-signer-service      - `brops-audit-signer.exe` is a plain console binary
            #                                  with no StartServiceCtrlDispatcher, so `sc.exe
            #                                  start` cannot succeed against it. Standing up a
            #                                  stub service instead would make the test pass
            #                                  against something the product does not ship. What
            #                                  is missing is the SCM implementation, not a runner.
            #  windows-owner-assignment      - stamping BUILTIN\Administrators as a file's owner
            #                                  needs SeRestorePrivilege, which is exactly what an
            #                                  unelevated account does not have. Wanting it here
            #                                  would mean running elevated, which is the posture
            #                                  this whole step exists to avoid.
            #  windows-elevated-registration - same trade, other direction: the live `sc.exe
            #                                  create` path needs an elevated token. It is
            #                                  covered offline by register.rs's argv tests and by
            #                                  the ElevationRequired refusal, which DOES run here.
            'set BROPS_TEST_MISSING_PREREQUISITES=installed-signer-service,windows-owner-assignment,windows-elevated-registration'
          )
          foreach ($exe in $exes) {
            $lines += "echo === $exe ==="
            $lines += "`"$exe`" --test-threads=1 --nocapture"
            $lines += 'if errorlevel 1 exit /b 1'
          }
          $lines += 'exit /b 0'
          $script = Join-Path $work 'run-tests.cmd'
          $lines | Set-Content -Path $script -Encoding ASCII

          $secure = ConvertTo-SecureString $env:BROPS_CI_PASSWORD -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential('brops-ci', $secure)
          $out = Join-Path $work 'stdout.txt'
          $err = Join-Path $work 'stderr.txt'
          try {
            $proc = Start-Process -FilePath $env:ComSpec -ArgumentList '/c', "`"$script`"" `
                      -Credential $cred -WorkingDirectory $work `
                      -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -Wait
          } catch {
            throw "could not start the suite as brops-ci, so the unelevated posture this leg is measured in was never entered: $_"
          }
          $proc.WaitForExit()
          if (Test-Path $out) { Get-Content $out }
          if (Test-Path $err) { Get-Content $err | ForEach-Object { Write-Host $_ } }
          $code = $proc.ExitCode
          if ($null -eq $code) { throw 'the standard-account run produced no exit code' }
          if ($code -ne 0) {
            throw "the trust-provisioning suite failed as brops-ci (exit $code). Note the posture: this run is deliberately NOT elevated, so a custody assertion failing here is a real refusal, not the elevated-token artefact the first run of this job produced."
          }

      - name: Remove the standard account
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          # Best effort: this is a throwaway runner, and a failure to clean up must not mask the
          # verdict of the step above.
          try { Remove-LocalUser -Name 'brops-ci' -ErrorAction Stop } catch { Write-Host "brops-ci not removed: $_" }


  windows-broker:
    name: Windows · §0.W broker syscall proof (named-pipe peer-auth)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # The pure §0.W verification core must pass on the ACTUAL Windows platform (not only the Linux
      # runner), then the REAL winapi named-pipe peer-SID authentication (the SO_PEERCRED equivalent,
      # §0.W.4) must authenticate a live client connection. This is a partial Windows machine-proof — it
      # does NOT flip platform_governed_execution_supported() (the remaining §0.1 primitives + the
      # dedicated-service-SID proof are unbuilt), so governed turns stay fail-closed on Windows.
      # Nine crates rebuilt from zero in every job that touches cargo: no workflow
      # cached anything, measured with `grep -c "rust-cache|~/.cargo" .github/workflows/*.yml`
      # returning 0 in all eleven files. Placed AFTER the toolchain step, not after
      # checkout: the plugin keys its cache on the CURRENT rustc version, so a cache
      # taken before the toolchain is selected is keyed on the runner's preinstalled
      # compiler and never hits. That is upstream's own instruction at this sha.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Pure §0.W predicates on Windows
        run: cargo test -p brops-core windows_broker --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Real named-pipe peer-SID authentication on Windows
        run: cargo test -p brops-win-broker --manifest-path apps/desktop/src-tauri/Cargo.toml
      # (remediation audit) `brops-win-live` — the crate that holds the Windows governed chain, the
      # pipe DACL and the §2.5 floor — ran in NO workflow at all. Its Windows-only code is
      # `#![cfg(windows)]`, so the Linux `governed-crates` job compiles past most of it; only here
      # do the real security-descriptor and DACL-walk paths execute. A kit with no CI coverage is
      # how F-02's defect survived on this platform after being marked closed on the Linux fix.
      - name: Windows governed-turn kit (real DACL + security-descriptor paths)
        run: cargo test -p brops-win-live --manifest-path apps/desktop/src-tauri/Cargo.toml
      # The shipped Tauri host crate is never COMPILED on Windows by CI, so the only code that can
      # produce a user-visible trust badge is checked by nothing on the platform it ships to.
      # `cargo check` rather than `test`: the GUI host needs a display for some tests, and a
      # compile-check on the shipping platform is the property that was missing.
      - name: Shipped desktop host compiles on Windows
        run: cargo check -p brops --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml
      # (audit) Both Windows "machine-proof" harnesses used to PRINT their expectation beside an
      # unexamined result and exit 0 whatever the pipe or the chain answered. They now compare, and the
      # comparison is a pure function driven by `-SelfTest` against synthetic transcripts -- including
      # the inverted-gate ones the old scripts waved through. That self-test needs no service accounts,
      # no elevation and no offline root key, so it runs HERE: a verdict nothing exercises is the same
      # defect one layer up.
      - name: Proof harnesses can actually fail (verdict self-tests)
        shell: pwsh
        run: |
          ./apps/desktop/src-tauri/win-broker/proof/isolation_proof.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./apps/desktop/src-tauri/win-live/proof/win_live_proof.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit 1 }

  engine:
    name: Engine · governance runtime (python)
    runs-on: ubuntu-latest
    env:
      BRO_ENV: ci
      # The operator-root trust anchor, pinned from OUTSIDE the registry (this is the committed registry's
      # operator PUBLIC key — safe to commit; if it is rotated without updating this pin, foundation
      # validation fails closed, which is the point). The foundation + live-wiring validators previously
      # lived ONLY in engine/.github/workflows/verify.yml, which GitHub never executes (it dispatches only
      # the ROOT .github/workflows/), so bro_validate.py + bro_live_validate.py ran NOWHERE in CI (audit
      # F-22). They now run here, on the workflow GitHub actually executes.
      BRO_OPERATOR_ROOT_PUBKEY: 7231f58d738616115dcd2a71502360331076465f253b3723c8db9be01361df3c
      # O-1 posture, job-wide: every python this job starts — and every child it spawns,
      # since this is an env var rather than a command-line flag — refuses to mint
      # __pycache__. runtime/, tools/ and tests/ are digest roots, and compiled bytecode
      # under one makes the wall refuse for the shadow, displacing the refusal the
      # live-wiring probe below exists to observe. (It does NOT cover py_compile /
      # compileall, which write explicitly whatever this says — hence the clean step.)
      # Deliberately safe for the bytecode tests: test_bytecode_shadow's clean_env()
      # strips this var precisely so its "without -B the wall mints its own cache"
      # assertions still exercise the real behaviour.
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install engine CI dependencies
        run: pip install --require-hashes -r requirements-ci.txt
      - name: Validate foundation (operator-root pin, fail-closed)
        run: python tools/bro_validate.py
      - name: Run the engine test suite
        run: python -m unittest discover -s tests
      # The live-wiring probe must watch the wall refuse FOR SCOPE. Since O-1,
      # assert_no_bytecode_shadow refuses on any __pycache__ under a digest root, and it
      # refuses from the SAME gate — so bytecode left by an earlier step replaces the
      # reason the probe exists to demonstrate while the probe still sees "deny", and
      # the check stays green having proven something else. PYTHONDONTWRITEBYTECODE
      # above stops the interpreters minting caches, but NOT py_compile: `Validate
      # foundation` calls tools/bro_validate.py, which py_compile's 30-odd targets and
      # writes runtime/__pycache__ + tools/__pycache__ whatever that variable says. So
      # the tree is cleaned HERE, immediately before the proof, rather than assumed.
      - name: Clear bytecode caches before the live-wiring proof
        run: |
          python -Bc "import pathlib, shutil; [shutil.rmtree(p, ignore_errors=True) for p in list(pathlib.Path('.').rglob('__pycache__'))]; [p.unlink() for p in list(pathlib.Path('.').rglob('*.pyc')) + list(pathlib.Path('.').rglob('*.pyo'))]"
      # -B is load-bearing, not hygiene: without it this validator's own imports of
      # runtime/** mint the shadow it is about to check for, and it fails closed on
      # itself. It refuses under a shadow and requires the refusal it observes to name
      # `missing BRO_WORKSPACE_BINDING` (the rule ci/live/run_live_turn.sh states in
      # expect_blocked: a negative must assert WHY, not merely THAT).
      - name: Assure live wiring (laws enforced by the WIRED hook, not merely present)
        run: python -B tools/bro_live_validate.py
      # AFTER the live-wiring proof, never before. compileall is the syntax gate for the
      # .py files no test imports, and it does its job by WRITING __pycache__ into
      # runtime/, tools/ and tests/ — all digest roots. Run first (as it was until now)
      # it made the wall refuse for the cache instead of for the scope, and the probe
      # went green on the wrong refusal. Last in the job, the caches it leaves can mask
      # nothing.
      # `ci/` is in the list because that is where the live kits live — the service
      # runners, the provisioners and the two orchestrators — and NO test imports any of
      # them. They were reachable only by running a kit as root on Linux, which means a
      # syntax error in one surfaced as a job that died mid-provision rather than as a
      # parse failure with a line number. It is not a digest root, so it does not
      # interact with the shadow reasoning above.
      - name: Compile Python (syntax gate for the files no test imports)
        run: python -m compileall -q runtime tools tests ci

  bridge:
    name: Bridge · engine adapter (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install bridge test dependencies (jsonschema, hash-pinned via engine)
        run: pip install --require-hashes -r engine/requirements-ci.txt
      - name: Run the bridge adapter tests
        working-directory: bridge
        run: python -m unittest discover -s tests

  coordination:
    name: Coordination · docs consistency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so the semantic gate can diff origin/<base>...HEAD on a PR and enforce
          # "a substantive code/schema/design change must update the state docs in the same PR".
          # On push/local (no GITHUB_BASE_REF) the diff check degrades to skip.
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Stdlib only — no dependencies. Fail-closed: malformed / structurally / semantically
      # inconsistent coordination docs cannot merge (structure + machine-readable current_state.json
      # anchor + docs-reference-active-PR + PR-diff state-doc drift guard).
      - name: Coordination-docs consistency gate
        run: python tools/check_coordination.py
      # The reverse of check_read_receipt: that one asks whether the session READ the
      # canon, this one asks whether the canon can still BE read. Every other gate here
      # can be satisfied by adding text; this is the only one that can only be satisfied
      # by removing it. The read manifest reached 1917 KB (~386k tokens) with
      # NEXT_CHAT.md and PROJECT_STATE.md carrying 3037 identical lines, because a
      # session that appends was compliant and a session that deletes was not.
      - name: Canonical read set within budget
        run: python tools/check_canon_budget.py
      # Could a brand-new session take over from this repository alone? CLAUDE.md's
      # continuous-documentation law has required that for weeks and nothing checked it.
      - name: Handoff is ready for a new session
        run: python tools/check_handoff_ready.py
      # A field nothing reads cannot be wrong, so nothing corrects it -- which is how
      # current_state.json's `purpose` reached 74,311 characters inside the file called
      # the machine-readable mirror (ninth audit I-06).
      - name: Machine mirror has no field nothing reads
        run: python tools/check_state_fields.py
      # Every defect found while cutting the read set down had one shape: something was
      # written down and nothing checked it was true. This checks the claims that have a
      # machine-checkable referent -- paths, commits, ticket ids, toolchain versions.
      - name: Canonical documents make no false checkable claim
        run: python tools/check_doc_claims.py
      # An assumption may not enter the record dressed as a fact. Either settle it and write
      # what it printed, or mark it UNVERIFIED with the experiment that would settle it.
      - name: No unmarked guess in a canonical document
        run: python tools/check_no_assumptions.py
      # Options without a recommendation are a decision passed upward while looking thorough.
      - name: Alternatives carry a reasoned recommendation
        run: python tools/check_recommendation.py
      # Every gate above judges content that is PRESENT. This one judges content that was LOST:
      # eleven Phase-1 Definition-of-Done rows had ended in the middle of a clause since
      # 2026-08-10, inside the rows check_roadmap_order.py reads to decide which phase a session
      # may work, and thirty gates passed over them.
      - name: No roadmap Definition-of-Done row ends mid-sentence
        run: python tools/check_truncated_lines.py
      # T-056. A check nothing invokes is a suggestion, and this gate is in its own
      # derived population: leaving it out of a REQUIRED job would make it declare
      # `blocks: nothing` about itself, which is the exact defect it exists to catch.
      # It sits in this job rather than a new one because a new job is a new context
      # and branch protection is the Owner's to change.
      - name: Controls name what their failure prevents (T-056)
        run: python tools/check_control_invocation.py
      # The desktop app's version is written five times across four files and nothing
      # reconciled them -- `npm ci` exits 0 with package.json at 9.9.9 and its lock at
      # 0.1.0 (measured). This job, not a new one: a new job is a new required context
      # and branch protection is the Owner's.
      - name: App version agrees with itself across all four files
        run: python tools/check_version_parity.py
      - name: Gate self-tests
        working-directory: tools
        run: |
          python -m unittest test_check_coordination
          python -m unittest test_check_canon_budget
          python -m unittest test_check_handoff_ready
          python -m unittest test_check_doc_claims
          python -m unittest test_check_recommendation
          python -m unittest test_check_truncated_lines
          python -m unittest test_roadmap_split
          python -m unittest test_check_control_invocation
          python -m unittest test_check_version_parity

  canonical-law:
    name: Canonical law · read receipt · roadmap order · update law
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: the update law diffs origin/<base>...HEAD on a PR.
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # The three rules CLAUDE.md has always stated and nothing at the repository ROOT ever
      # enforced. The session-side wall (.claude/hooks/canonical_law_gate.py) fails OPEN on
      # its own bugs so it can never brick the repository; THIS job is the half that fails
      # closed, and it is the half that cannot be skipped with --no-verify or an env var.
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_read_receipt test_check_roadmap_order test_check_prior_art test_check_canonical_sync test_check_no_lstrip_prefix test_wall_bash_gap test_check_main_ci
      # `lstrip("./")` strips a CHARACTER SET, not a prefix, and reads exactly like a prefix
      # strip. It was written three times: check_doc_claims.py hit it and fixed it inline
      # leaving only a comment, and check_roadmap_order.py:373 plus check_audit_reports.py:119
      # both carried it live at the same head. The first made every `.claude/` and `.github/`
      # path invisible to the `meta` scope check -- the two directories `meta` exists to cover
      # -- and mangled every path for an agent working under `.claude/worktrees/`. It also went
      # the other way: `../tools/x` was laundered into `tools/x`, a traversal arriving inside an
      # allow-listed prefix. Two of the three gates this job runs were affected, which is why
      # the sweep lives here (T-053).
      - name: No `lstrip` used as a path-prefix strip
        run: python tools/check_no_lstrip_prefix.py
      # Roadmap order: a phase counts as complete only when its Definition-of-Done checkboxes
      # AND its status-board row agree. Flipping one is refused, which is what stops "phase
      # complete" from being a one-character edit.
      - name: Roadmap completion is stated the same way in both places
        run: python tools/check_roadmap_order.py
      # The audit trail has to be openable (sixth audit, A-06). The FIFTH round's report was never
      # written to the repository: the ledger went on naming the FOURTH as authoritative while the
      # OWNER page carried the fifth's verdict and its 15 promotions to ✅, so every citation the
      # round embedded in source comments pointed at a document nobody could open. The auditor is
      # deliberately read-only on the tree, so filing the report is the Builder's step — and an
      # unwritten Builder step is one nobody notices. This is the half that fails closed.
      - name: Every audit citation opens, and the ledger agrees with the OWNER page
        run: python tools/check_audit_reports.py
      # The update law, per PR. Stricter than check_coordination's any-one-state-file rule:
      # EVERY required document, and no environment bypass.
      - name: Code and canon moved together
        if: github.event_name == 'pull_request'
        run: python tools/check_canonical_sync.py --base "${{ github.base_ref }}"
      # A read receipt can be recorded in CI, which proves the canonical set is complete and
      # hashable — every manifest path exists and is readable. It does NOT prove a human or
      # a model read anything; that is the session-side hook's job and is stated as such.
      - name: The canonical set is complete and hashable
        run: python tools/check_read_receipt.py --record --session ci-$GITHUB_RUN_ID

  repo-state:
    name: Repo-state · live GitHub truth verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # NOTE: this job CANNOT read branch protection. `administration` is not a valid
      # GITHUB_TOKEN permission scope - adding it made GitHub reject the whole workflow file,
      # which produced the failure mode `unparseable_workflows` now catches: zero jobs, the run
      # listed by filename, and the pull request reading as blocked on missing contexts.
      #
      # So `verify_branch_protection` runs only where the caller has admin rights - locally,
      # or Owner-run. In CI it reports SKIPPED with the reason. What CI verifies instead is the
      # half that needs no rights: every context in `config/required-checks.json` names a job
      # that actually exists in a workflow. That catches the likely drift - a renamed job - and
      # says so; it does not catch protection being turned off, and does not claim to.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so verify_main_push() can `git merge-base --is-ancestor` the baseline against
          # the pushed main HEAD (this is what makes merging the carrier PR provably non-red on main).
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Offline unit tests of the pure functions (merge->main-push GREEN, exact-head drift RED, ...).
      # sync_active_pr is tested in the SAME job as the gate that reads its output: it is the
      # generator that writes config/current_state.json, and every stale-canon incident this
      # repository has recorded was manufactured there. Tests are wired one-by-one here (there is no
      # discover over tools/), so a test file that is not named on this line does not run at all.
      #
      # That warning was accurate and insufficient. `test_renderer_broker_schemas` — 13 tests of the
      # renderer<->broker governed-turn schema contracts (rev-30 §4.10(g)) — was named on no line in
      # any workflow and had never run in CI; the sixth independent audit found it (A-12). Naming a
      # trap in a comment does not close it, so `check_reachability.py::unrun_test_modules` now
      # sweeps BACKWARD: any tools/test_*.py that no workflow names is RED. Forgetting this line is
      # now a build failure rather than a quiet nothing.
      - name: pure-function self-tests
        working-directory: tools
        run: python -m unittest test_check_repo_state test_sync_active_pr test_stamp_pr_head test_check_schema_mirrors test_renderer_broker_schemas test_check_audit_reports test_check_contracts_single_source test_check_dead_tokens
      # LIVE, fail-closed: verify config/current_state.json against real GitHub PR state. A merged PR
      # still recorded 'open' (the volatile-snapshot failure mode) fails this job. gh auto-auths via
      # the workflow token.
      # M1 of the contracts dedupe (docs/design/CONTRACTS_DEDUPE_PLAN.md): the Rust structs that
      # claim to mirror an engine schema were bound to it by nothing but a doc comment. A schema
      # can gain a required field, or a mirror lose one, and nothing notices until a real payload
      # fails somewhere expensive. This is the binding, and it needs no file to move.
      - name: Schema mirrors (Rust structs vs engine schemas)
        run: python tools/check_schema_mirrors.py

      # M2 of the same plan, and the ninth audit's I-13: contracts/ was a lone README describing an
      # intention while engine/schemas/ held the files, and nothing about that was blocked by the
      # production gate. contracts/ is the SOURCE now; the engine keeps a byte-identical vendored
      # copy because its loaders are root-relative and engine/ is a subtree of menqstudio/Bro.
      # Editing one side alone is RED, and a new engine schema must be classified by a person.
      - name: Contracts single source (contracts/ vs engine/schemas/)
        run: python tools/check_contracts_single_source.py

      # The reverse of check_c1_tokens: that one asserts every `var(--x)` RESOLVES, this one asserts
      # every declaration is READ. T-033 deleted 1185 unreachable CSS rules and the custom properties
      # they read survived, because nothing counted a declaration nobody reads -- 20 of 149 were dead.
      - name: Dead design tokens (declared and read by nothing)
        run: python tools/check_dead_tokens.py

      - name: Live GitHub truth check (fail-closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/check_repo_state.py

  capabilities:
    name: Capability · inventory gate (T-010)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Stdlib only. Fail-closed: registered (lib.rs) == AppManifest (build.rs) ==
      # capability-policy inventory == capability grants (default.json). A command
      # added in one place but not the others — or ungated — cannot merge.
      - name: Capability inventory consistency gate
        run: python tools/check_capabilities.py
      # T-052. The rule at `repo::audit::record` says the actor is passed explicitly by
      # trusted repo code and never hardcoded 'user'. 34 of the 40 calls in that same file
      # passed the literal pair "user", "gev" -- including the automation scheduler's
      # unattended once-a-minute tick, which recorded a named human who was not present.
      # An audit row that says a person did something they did not do reads as evidence.
      - name: Audit actor attribution gate (no hardcoded actor)
        run: python tools/check_audit_actor.py
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_capabilities test_check_audit_actor

  ledger-ddl:
    name: Supervisor · durable-ledger DDL single-source gate (F-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Stdlib only. Fail-closed: the Python supervisor (the production writer of the
      # durable acceptance state) and the Rust `brops-core` ledger must compile the
      # BYTE-IDENTICAL DDL, because that SQL *is* the enforcement — the one-attempt-per-
      # challenge CAS, the closed state machine, the write-once completion PK, and the
      # evidence-head floor. A divergence, a missing copy, or a deleted constraint is RED.
      - name: Ledger DDL single-source gate
        run: python tools/check_ledger_ddl_parity.py
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_ledger_ddl_parity

  spec-conformance:
    name: Spec · every § reference declares whether it is implemented
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Stdlib only. The third audit round changed lens — code vs the SPEC rather than code vs
      # the ledger the implementer writes — and immediately found numbered sections cited as
      # though satisfied while nothing implemented them. That is the same mechanism by which the
      # earlier P0s passed review: `// §7.1(d)` beside a line reads as a statement of fact.
      # A § reference is now a claim this job checks.
      - name: Spec-reference conformance gate
        run: python tools/check_spec_references.py
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_spec_references

  produced-artifact:
    name: Production half · the five conditions (T-055)
    runs-on: ubuntu-latest
    # This job was RED BY DESIGN from the commit that introduced it (#193) until T-055 made it
    # pass. It is GREEN now, and that changes what it is for: it stops being a statement of what
    # is missing and becomes the thing that notices if any of the five stops holding.
    #
    # Every other piece of work in this repository has a gate and therefore a measurable "done".
    # The production half — what a paying customer actually receives — had none, so it lost every
    # scheduling contest to work whose finish line a machine could see. Writing the gate first and
    # leaving it failing is what ended that.
    #
    # It is still ABSENT from config/required-checks.json, and the reason has changed with it.
    # It is no longer "this can never pass"; it is that a context must be OBSERVED green in CI
    # before it is required. This repository learned that the expensive way: `Windows · §0.W broker
    # syscall proof` was made required on 2026-08-18 and failed the same day, and its exclusion
    # note in config/required-checks.json is the record. Requiring a context on the strength of a
    # local run is the same mistake in a new place.
    #
    # That deferral is not a comment anyone has to remember — it is a DATED entry in
    # config/deferred-enforcement.json, and tools/check_repo_state.py::verify_deferred_enforcement
    # (which runs inside the already-required `Repo-state` context) turns RED once the date passes
    # while this name is still missing from `contexts`.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # The self-test runs FIRST and must pass. It is the only evidence that this gate can be
      # satisfied at all: it builds a synthetic tree meeting all five conditions and asserts GREEN.
      # A gate that has never been observed passing measures nothing, which is the same defect one
      # level up from the one this gate exists to catch.
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_produced_artifact
      # The evidence is PRODUCED here, from the real code path, and is never
      # committed: `store_root` lives under `target/`, and the gate refuses a
      # store whose files `git ls-files` reports, because a committed store is a
      # fixture and not a product. The producer command is the one recorded in
      # config/produced-artifact-contract.json -- CI runs what the contract says
      # it runs, so a reader can reproduce this locally with the same line.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # Nine crates rebuilt from zero in every job that touches cargo: no workflow
      # cached anything, measured with `grep -c "rust-cache|~/.cargo" .github/workflows/*.yml`
      # returning 0 in all eleven files. Placed AFTER the toolchain step, not after
      # checkout: the plugin keys its cache on the CURRENT rustc version, so a cache
      # taken before the toolchain is selected is keyed on the runner's preinstalled
      # compiler and never hits. That is upstream's own instruction at this sha.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Produce the artifact from the real code path
        working-directory: apps/desktop/src-tauri
        run: cargo run -q -p brops-core --bin produce_agent_artifact -- target/produced-artifact
      - name: The five conditions a customer sees
        run: python tools/check_produced_artifact.py


  negative-matrix:
    name: Negative matrix · every declared test ID says what establishes it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Stdlib only. docs/design/SECURITY_NEGATIVE_TEST_MATRIX.md declares 242 negative test
      # IDs; at the head this job landed on, exactly ONE of them appeared anywhere in .rs/.py/.ts
      # source — in a docstring saying the control it names is not implemented. 241 obligations
      # were declared and nothing established any of them. The mirror now records, per ID,
      # whether a real test binds it, and this job refuses drift between the two.
      - name: Mirror matches the markdown (generated, not hand-kept)
        run: python tools/generate_negative_matrix.py --check
      - name: Every matrix ID says what establishes it
        run: python tools/check_negative_matrix.py
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_negative_matrix
      - name: The implemented slice
        env:
          BRO_ENV: ci
        run: python -m unittest discover -s engine/tests -t engine/tests -p "test_negative_matrix.py"

  signer-isolation:
    name: Engine · signer isolation proof (linux, dedicated principals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install engine CI dependencies
        run: pip install --require-hashes -r engine/requirements-ci.txt
      # Wave 3b-1 (audit P0-1): machine-prove the four same-login-user denials against REAL signer +
      # supervisor services running as dedicated OS principals — the login (attacker) user cannot
      # connect to the signer socket (SO_PEERCRED), read the private keys, read/write the protected
      # store, or make the supervisor sign caller-supplied evidence. No skip / placeholder.
      - name: Prove signer/supervisor isolation with dedicated users
        run: bash engine/ci/isolation_proof.sh
      # T-020 / FW-1: the Floor Writer's principal boundary, with FOUR real accounts over a real
      # AF_UNIX socket — the authorized caller advances, an unlisted principal on the same socket
      # is denied, and a caller admitted to floor.get is denied floor.advance. Plus the four
      # provisioning negatives (the completion principal cannot replace the endpoint, read or
      # write the floor state, or rewrite the TCB-owned config) and three meta-controls. The
      # script SKIPS with a stated reason off Linux or without passwordless sudo; on this runner
      # it has neither excuse.
      - name: Prove the Floor Writer principal boundary with dedicated users
        run: bash engine/ci/floor_writer_boundary_proof.sh
