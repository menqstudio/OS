name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `edited` and `ready_for_review` are REQUIRED: the exact audited head is anchored out-of-band in
    # the PR body (`AUDIT_CANDIDATE_HEAD: <sha>`). A body edit must start a fresh repo-state run so the
    # exact-head check re-reads the marker — the default pull_request trigger does NOT fire on `edited`.
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  contents: read

# Phase 0: each half builds and tests independently. A cross-integration
# (bridge) smoke test is added in Phase 1.
jobs:
  cockpit-frontend:
    name: Cockpit · frontend (typecheck + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  cockpit-core:
    name: Cockpit · SQLite data core (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Test the SQLite data core
        run: cargo test -p brops-core --manifest-path apps/desktop/src-tauri/Cargo.toml

  governed-crates:
    name: Governed chain · production crates (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # (remediation audit) 52 `#[test]` functions in the crates that ACTUALLY produce a
      # trusted_verified — the setuid launcher, the contained executor, the broker chain and the
      # live driver — were run by no CI job at all, and `brops-executor` was never even compiled.
      # `brops-core` alone was tested, which is the crate least able to forge anything. A test
      # that no job runs is not a test; it is a file that resembles one.
      #
      # The Tauri host crate (`brops`) is deliberately NOT here: it needs webkit2gtk. Its absence
      # is a real coverage gap on Windows and is tracked separately — it is stated rather than
      # papered over by testing something adjacent and calling it covered.
      - name: Test the launcher, executor, broker and live driver
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml             -p brops-launcher -p brops-executor -p brops-broker -p brops-governed-live             -p brops-win-live -p brops-win-broker

  live-governed-turn:
    name: Linux · LIVE 7-service governed turn (real uids, setuid launcher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # `engine/ci/live/run_live_turn.sh` is the ONLY thing that exercises the real OS trust
      # boundary: six dedicated uids, AF_UNIX + SO_PEERCRED peer auth, per-service key custody
      # modes, and the privileged recorder → setuid launcher → contained executor spawn. Until now
      # nothing re-ran it — `CURRENT_LINUX_E2E: proven` rested on a single manual run that no gate
      # reproduced (independent audit, ci-tests section). A hosted ubuntu runner has everything the
      # script asks for: passwordless sudo, useradd, setuid on ext4, /opt, and sudoers.d.
      - name: Install engine crypto dependency
        run: pip install --require-hashes -r engine/requirements-ci.txt
      - name: Build the live-turn binaries (launcher + recorder/executor/driver)
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml -p brops-launcher -p brops-governed-live
      # The script documents these accounts as "already provisioned on the box"; on an ephemeral
      # runner we provision them here. Fixed uids so a failure is legible against the design's
      # §0 principal table. `--no-create-home` keeps them without a traversable home, which is the
      # posture the design assumes.
      - name: Provision the six service accounts
        run: |
          set -eu
          for spec in \
            "brops-verifier_broker:5001" \
            "brops-challenge:5002" \
            "brops-supervisor:5004" \
            "brops-recorder:5005" \
            "brops-signer:5006" \
            "brops-executor:5007" ; do
            user="${spec%%:*}"; uid="${spec##*:}"
            sudo groupadd -g "$uid" "$user"
            sudo useradd -u "$uid" -g "$uid" -M --no-create-home -s /usr/sbin/nologin "$user"
          done
          id brops-verifier_broker; id brops-executor
      # Fail-closed by construction: the script exits non-zero unless the driver prints
      # `production_verified=true bound=true`, and it never fabricates an acceptance. A RED here
      # means the live chain is broken — which is exactly what this job exists to surface.
      # Invoked through `bash` rather than as an executable: the script is tracked 100644 (it was
      # only ever run by hand on a provisioned box), and relying on the mode bit would make this
      # gate depend on a checkout detail rather than on the chain it is meant to prove.
      - name: Run ONE live governed turn end to end
        run: sudo -E env "PATH=$PATH" bash engine/ci/live/run_live_turn.sh

  cockpit-host:
    name: Cockpit · Tauri host (cargo check + ai tests)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev
      - name: Compile the Tauri host crate
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Test the host crate (ai.rs governed/receipt unit tests)
        run: cargo test -p brops --manifest-path apps/desktop/src-tauri/Cargo.toml

  windows-broker:
    name: Windows · §0.W broker syscall proof (named-pipe peer-auth)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # The pure §0.W verification core must pass on the ACTUAL Windows platform (not only the Linux
      # runner), then the REAL winapi named-pipe peer-SID authentication (the SO_PEERCRED equivalent,
      # §0.W.4) must authenticate a live client connection. This is a partial Windows machine-proof — it
      # does NOT flip platform_governed_execution_supported() (the remaining §0.1 primitives + the
      # dedicated-service-SID proof are unbuilt), so governed turns stay fail-closed on Windows.
      - name: Pure §0.W predicates on Windows
        run: cargo test -p brops-core windows_broker --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Real named-pipe peer-SID authentication on Windows
        run: cargo test -p brops-win-broker --manifest-path apps/desktop/src-tauri/Cargo.toml
      # (remediation audit) `brops-win-live` — the crate that holds the Windows governed chain, the
      # pipe DACL and the §2.5 floor — ran in NO workflow at all. Its Windows-only code is
      # `#![cfg(windows)]`, so the Linux `governed-crates` job compiles past most of it; only here
      # do the real security-descriptor and DACL-walk paths execute. A kit with no CI coverage is
      # how F-02's defect survived on this platform after being marked closed on the Linux fix.
      - name: Windows governed-turn kit (real DACL + security-descriptor paths)
        run: cargo test -p brops-win-live --manifest-path apps/desktop/src-tauri/Cargo.toml
      # The shipped Tauri host crate is never COMPILED on Windows by CI, so the only code that can
      # produce a user-visible trust badge is checked by nothing on the platform it ships to.
      # `cargo check` rather than `test`: the GUI host needs a display for some tests, and a
      # compile-check on the shipping platform is the property that was missing.
      - name: Shipped desktop host compiles on Windows
        run: cargo check -p brops --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml

  engine:
    name: Engine · governance runtime (python)
    runs-on: ubuntu-latest
    env:
      BRO_ENV: ci
      # The operator-root trust anchor, pinned from OUTSIDE the registry (this is the committed registry's
      # operator PUBLIC key — safe to commit; if it is rotated without updating this pin, foundation
      # validation fails closed, which is the point). The foundation + live-wiring validators previously
      # lived ONLY in engine/.github/workflows/verify.yml, which GitHub never executes (it dispatches only
      # the ROOT .github/workflows/), so bro_validate.py + bro_live_validate.py ran NOWHERE in CI (audit
      # F-22). They now run here, on the workflow GitHub actually executes.
      BRO_OPERATOR_ROOT_PUBKEY: 7231f58d738616115dcd2a71502360331076465f253b3723c8db9be01361df3c
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install engine CI dependencies
        run: pip install --require-hashes -r requirements-ci.txt
      - name: Validate foundation (operator-root pin, fail-closed)
        run: python tools/bro_validate.py
      - name: Run the engine test suite
        run: python -m unittest discover -s tests
      - name: Compile Python
        run: python -m compileall -q runtime tools tests
      - name: Assure live wiring (laws enforced by the WIRED hook, not merely present)
        run: python tools/bro_live_validate.py

  bridge:
    name: Bridge · engine adapter (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install bridge test dependencies (jsonschema, hash-pinned via engine)
        run: pip install --require-hashes -r engine/requirements-ci.txt
      - name: Run the bridge adapter tests
        working-directory: bridge
        run: python -m unittest discover -s tests

  coordination:
    name: Coordination · docs consistency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so the semantic gate can diff origin/<base>...HEAD on a PR and enforce
          # "a substantive code/schema/design change must update the state docs in the same PR".
          # On push/local (no GITHUB_BASE_REF) the diff check degrades to skip.
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Stdlib only — no dependencies. Fail-closed: malformed / structurally / semantically
      # inconsistent coordination docs cannot merge (structure + machine-readable current_state.json
      # anchor + docs-reference-active-PR + PR-diff state-doc drift guard).
      - name: Coordination-docs consistency gate
        run: python tools/check_coordination.py
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_coordination

  repo-state:
    name: Repo-state · live GitHub truth verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so verify_main_push() can `git merge-base --is-ancestor` the baseline against
          # the pushed main HEAD (this is what makes merging the carrier PR provably non-red on main).
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Offline unit tests of the pure functions (merge->main-push GREEN, exact-head drift RED, ...).
      - name: pure-function self-tests
        working-directory: tools
        run: python -m unittest test_check_repo_state
      # LIVE, fail-closed: verify config/current_state.json against real GitHub PR state. A merged PR
      # still recorded 'open' (the volatile-snapshot failure mode) fails this job. gh auto-auths via
      # the workflow token.
      - name: Live GitHub truth check (fail-closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/check_repo_state.py

  capabilities:
    name: Capability · inventory gate (T-010)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Stdlib only. Fail-closed: registered (lib.rs) == AppManifest (build.rs) ==
      # capability-policy inventory == capability grants (default.json). A command
      # added in one place but not the others — or ungated — cannot merge.
      - name: Capability inventory consistency gate
        run: python tools/check_capabilities.py
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_capabilities

  ledger-ddl:
    name: Supervisor · durable-ledger DDL single-source gate (F-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Stdlib only. Fail-closed: the Python supervisor (the production writer of the
      # durable acceptance state) and the Rust `brops-core` ledger must compile the
      # BYTE-IDENTICAL DDL, because that SQL *is* the enforcement — the one-attempt-per-
      # challenge CAS, the closed state machine, the write-once completion PK, and the
      # evidence-head floor. A divergence, a missing copy, or a deleted constraint is RED.
      - name: Ledger DDL single-source gate
        run: python tools/check_ledger_ddl_parity.py
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_ledger_ddl_parity

  spec-conformance:
    name: Spec · every § reference declares whether it is implemented
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Stdlib only. The third audit round changed lens — code vs the SPEC rather than code vs
      # the ledger the implementer writes — and immediately found numbered sections cited as
      # though satisfied while nothing implemented them. That is the same mechanism by which the
      # earlier P0s passed review: `// §7.1(d)` beside a line reads as a statement of fact.
      # A § reference is now a claim this job checks.
      - name: Spec-reference conformance gate
        run: python tools/check_spec_references.py
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_spec_references

  signer-isolation:
    name: Engine · signer isolation proof (linux, dedicated principals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install engine CI dependencies
        run: pip install --require-hashes -r engine/requirements-ci.txt
      # Wave 3b-1 (audit P0-1): machine-prove the four same-login-user denials against REAL signer +
      # supervisor services running as dedicated OS principals — the login (attacker) user cannot
      # connect to the signer socket (SO_PEERCRED), read the private keys, read/write the protected
      # store, or make the supervisor sign caller-supplied evidence. No skip / placeholder.
      - name: Prove signer/supervisor isolation with dedicated users
        run: bash engine/ci/isolation_proof.sh
