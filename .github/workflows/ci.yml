name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `edited` and `ready_for_review` are REQUIRED: the exact audited head is anchored out-of-band in
    # the PR body (`AUDIT_CANDIDATE_HEAD: <sha>`). A body edit must start a fresh repo-state run so the
    # exact-head check re-reads the marker — the default pull_request trigger does NOT fire on `edited`.
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  contents: read

# Phase 0: each half builds and tests independently. A cross-integration
# (bridge) smoke test is added in Phase 1.
jobs:
  cockpit-frontend:
    name: Cockpit · frontend (typecheck + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  cockpit-core:
    name: Cockpit · SQLite data core (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Test the SQLite data core
        run: cargo test -p brops-core --manifest-path apps/desktop/src-tauri/Cargo.toml

  cockpit-host:
    name: Cockpit · Tauri host (cargo check + ai tests)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev
      - name: Compile the Tauri host crate
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Test the host crate (ai.rs governed/receipt unit tests)
        run: cargo test -p brops --manifest-path apps/desktop/src-tauri/Cargo.toml

  windows-broker:
    name: Windows · §0.W broker syscall proof (named-pipe peer-auth)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # The pure §0.W verification core must pass on the ACTUAL Windows platform (not only the Linux
      # runner), then the REAL winapi named-pipe peer-SID authentication (the SO_PEERCRED equivalent,
      # §0.W.4) must authenticate a live client connection. This is a partial Windows machine-proof — it
      # does NOT flip platform_governed_execution_supported() (the remaining §0.1 primitives + the
      # dedicated-service-SID proof are unbuilt), so governed turns stay fail-closed on Windows.
      - name: Pure §0.W predicates on Windows
        run: cargo test -p brops-core windows_broker --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Real named-pipe peer-SID authentication on Windows
        run: cargo test -p brops-win-broker --manifest-path apps/desktop/src-tauri/Cargo.toml

  engine:
    name: Engine · governance runtime (python)
    runs-on: ubuntu-latest
    env:
      BRO_ENV: ci
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install engine CI dependencies
        run: pip install --require-hashes -r requirements-ci.txt
      - name: Run the engine test suite
        run: python -m unittest discover -s tests

  bridge:
    name: Bridge · engine adapter (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install bridge test dependencies (jsonschema, hash-pinned via engine)
        run: pip install --require-hashes -r engine/requirements-ci.txt
      - name: Run the bridge adapter tests
        working-directory: bridge
        run: python -m unittest discover -s tests

  coordination:
    name: Coordination · docs consistency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so the semantic gate can diff origin/<base>...HEAD on a PR and enforce
          # "a substantive code/schema/design change must update the state docs in the same PR".
          # On push/local (no GITHUB_BASE_REF) the diff check degrades to skip.
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Stdlib only — no dependencies. Fail-closed: malformed / structurally / semantically
      # inconsistent coordination docs cannot merge (structure + machine-readable current_state.json
      # anchor + docs-reference-active-PR + PR-diff state-doc drift guard).
      - name: Coordination-docs consistency gate
        run: python tools/check_coordination.py
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_coordination

  repo-state:
    name: Repo-state · live GitHub truth verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so verify_main_push() can `git merge-base --is-ancestor` the baseline against
          # the pushed main HEAD (this is what makes merging the carrier PR provably non-red on main).
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Offline unit tests of the pure functions (merge->main-push GREEN, exact-head drift RED, ...).
      - name: pure-function self-tests
        working-directory: tools
        run: python -m unittest test_check_repo_state
      # LIVE, fail-closed: verify config/current_state.json against real GitHub PR state. A merged PR
      # still recorded 'open' (the volatile-snapshot failure mode) fails this job. gh auto-auths via
      # the workflow token.
      - name: Live GitHub truth check (fail-closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/check_repo_state.py

  capabilities:
    name: Capability · inventory gate (T-010)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Stdlib only. Fail-closed: registered (lib.rs) == AppManifest (build.rs) ==
      # capability-policy inventory == capability grants (default.json). A command
      # added in one place but not the others — or ungated — cannot merge.
      - name: Capability inventory consistency gate
        run: python tools/check_capabilities.py
      - name: Gate self-tests
        working-directory: tools
        run: python -m unittest test_check_capabilities

  signer-isolation:
    name: Engine · signer isolation proof (linux, dedicated principals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install engine CI dependencies
        run: pip install --require-hashes -r engine/requirements-ci.txt
      # Wave 3b-1 (audit P0-1): machine-prove the four same-login-user denials against REAL signer +
      # supervisor services running as dedicated OS principals — the login (attacker) user cannot
      # connect to the signer socket (SO_PEERCRED), read the private keys, read/write the protected
      # store, or make the supervisor sign caller-supplied evidence. No skip / placeholder.
      - name: Prove signer/supervisor isolation with dedicated users
        run: bash engine/ci/isolation_proof.sh
